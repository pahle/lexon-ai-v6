name: Supply chain
on:
  pull_request:
  push:
    branches:
      - main
permissions:
  contents: read
concurrency:
  group: supply-chain-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  osv-scanner:
    # Fails on any known vulnerability in pnpm-lock.yaml that is not in the
    # osv-scanner.toml allowlist (each entry has a reason and an expiry).
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Scan pnpm-lock.yaml with OSV-Scanner
        uses: google/osv-scanner-action/osv-scanner-action@32d3cd482bdadfb38b186c0ad1b031902d55d932 # v2.7.1
        with:
          scan-args: |-
            --config=osv-scanner.toml
            --lockfile=pnpm-lock.yaml
  sbom:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Generate the CycloneDX SBOM of pnpm-lock.yaml with Syft
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          file: pnpm-lock.yaml
          format: cyclonedx-json
          syft-version: v1.57.1
          output-file: sbom.cdx.json
          upload-artifact: false
          upload-release-assets: false
      - name: Check the SBOM
        run: node scripts/sbom-check.mjs sbom.cdx.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: sbom-cyclonedx-${{ github.sha }}
          path: sbom.cdx.json
          if-no-files-found: error
          retention-days: 30
