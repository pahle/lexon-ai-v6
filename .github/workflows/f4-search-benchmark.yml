name: F4 search benchmark
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/f4-search-benchmark.yml'
      - 'backend/drizzle/0035_chat_search.sql'
      - 'backend/drizzle/0036_chat_search_vectors.sql'
      - 'backend/drizzle/*chat*search*.sql'
      - 'backend/package.json'
      - 'backend/src/config/**'
      - 'backend/src/infrastructure/db/chat-search.repository.ts'
      - 'backend/src/infrastructure/db/testing/**'
      - 'backend/src/infrastructure/db/schema.ts'
      - 'backend/src/infrastructure/db/testing/chat-search-benchmark.ts'
      - 'backend/src/infrastructure/db/testing/chat-search-evidence.ts'
      - 'backend/src/infrastructure/db/testing/chat-fixture.ts'
      - 'backend/src/modules/chat/chat-search*.ts'
      - 'backend/src/modules/chat/chat.controller.ts'
      - 'backend/test/integration/chat-search*.spec.ts'
      - 'backend/test/setup/**'
      - 'backend/vitest.chat-search-benchmark.config.ts'
      - 'backend/vitest*.config.ts'
      - 'vitest.config.ts'
      - 'config/container-images.env'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'scripts/container-images.mjs'
      - 'scripts/test/prepare-f4-search-evidence.mjs'
      - 'scripts/test/f4-search-isolation.spec.mjs'
      - 'shared/src/chat.ts'
      - 'shared/src/index.ts'
permissions:
  contents: read
concurrency:
  group: f4-search-benchmark-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  search-benchmark:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      CI: true
      F4_RUNNER_IMAGE: ubuntu-24.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.sha }}
      - name: Initialize sanitized search evidence
        run: node scripts/test/prepare-f4-search-evidence.mjs
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 10.33.1
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24.22.1
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Run only the representative search benchmark
        run: pnpm exec vitest run --config backend/vitest.chat-search-benchmark.config.ts
      - name: Upload search evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: f4-search-benchmark-${{ github.sha }}
          path: test-results/f4-search/*.jsonl
          retention-days: 14
          if-no-files-found: error
