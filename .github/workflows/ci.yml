name: Lexon
on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      visual_mode:
        description: Visual comparison or explicit approved baseline update
        required: true
        type: choice
        options:
          - compare
          - capture
          - update
        default: compare
permissions:
  contents: read
concurrency:
  group: lexon-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  changes:
    # Classifies the changed files (scripts/ci-changes.mjs, tested in
    # scripts/test/ci-changes.spec.mjs). Every consumer fails safe: if this
    # job does not succeed, everything runs.
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      docs_only: ${{ steps.classify.outputs.docs_only }}
      mutation_identity: ${{ steps.classify.outputs.mutation_identity }}
      mutation_contracts: ${{ steps.classify.outputs.mutation_contracts }}
      mutation_indicator: ${{ steps.classify.outputs.mutation_indicator }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: List the changed files
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: gh api --paginate "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}/files" --jq '.[].filename' > "$RUNNER_TEMP/changed-files.txt"
      - name: Classify the changes
        id: classify
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          touch "$RUNNER_TEMP/changed-files.txt"
          node scripts/ci-changes.mjs "$EVENT_NAME" < "$RUNNER_TEMP/changed-files.txt" | tee -a "$GITHUB_OUTPUT"
  unit-integration:
    needs: changes
    if: ${{ !cancelled() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      CI: true
      NEXT_TELEMETRY_DISABLED: 1
      # Docs-only pull requests run formatting and the tooling tests (which
      # read docs) and skip the code gates.
      LEXON_RUN_ALL: ${{ needs.changes.result != 'success' || needs.changes.outputs.docs_only != 'true' }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 10.33.1
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24.22.1
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Docs-only change, code gates not needed
        if: env.LEXON_RUN_ALL != 'true'
        run: echo "Docs-only change. Formatting and the tooling tests still run."
      - name: Build what the tooling tests run (docs-only)
        if: env.LEXON_RUN_ALL != 'true'
        run: |
          pnpm --filter @lexon/contracts build
          pnpm --filter @lexon/backend build
      - name: Root lint
        if: env.LEXON_RUN_ALL == 'true'
        run: pnpm lint
      - name: Formatting
        run: pnpm format:check
      - name: Package gates in dependency order
        if: env.LEXON_RUN_ALL == 'true'
        run: |
          for package in contracts backend frontend evals; do
            pnpm --filter "@lexon/$package" lint
            pnpm --filter "@lexon/$package" build
            pnpm --filter "@lexon/$package" typecheck
          done
      - name: Unit and isolated Testcontainers integration
        if: env.LEXON_RUN_ALL == 'true'
        run: pnpm test
      - name: Identity policy mutation gate
        if: env.LEXON_RUN_ALL == 'true' && (needs.changes.result != 'success' || needs.changes.outputs.mutation_identity == 'true')
        run: pnpm --filter @lexon/backend test:mutation:identity
      - name: Job title contract mutation gate
        if: env.LEXON_RUN_ALL == 'true' && (needs.changes.result != 'success' || needs.changes.outputs.mutation_contracts == 'true')
        run: pnpm --filter @lexon/contracts test:mutation
      - name: Thinking indicator mutation gate
        if: env.LEXON_RUN_ALL == 'true' && (needs.changes.result != 'success' || needs.changes.outputs.mutation_indicator == 'true')
        run: pnpm --filter @lexon/frontend test:mutation:indicator
      - name: Read the Playwright version
        id: playwright
        run: printf 'version=%s\n' "$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"
      - name: Restore Playwright browsers
        id: playwright-cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}-${{ steps.playwright.outputs.version }}
      - name: Install Chromium on a cache miss
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: pnpm exec playwright install --with-deps chromium
      - name: Install Chromium system dependencies on a cache hit
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: pnpm exec playwright install-deps chromium
      - name: Tooling and cleanup assertions
        run: node --test scripts/test/*.spec.mjs
  compose-e2e:
    name: compose-e2e (${{ matrix.shard }}/3)
    needs: changes
    # Always runs so the matrix check names stay expanded; a docs-only pull
    # request reports success from the first step and skips the rest.
    if: ${{ !cancelled() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    env:
      CI: true
      NEXT_TELEMETRY_DISABLED: 1
      LEXON_E2E_PROJECT: lexon-e2e-${{ github.run_id }}-${{ matrix.shard }}
      LEXON_RUN_E2E: ${{ needs.changes.result != 'success' || needs.changes.outputs.docs_only != 'true' }}
    steps:
      - name: Docs-only change, E2E not needed
        if: env.LEXON_RUN_E2E != 'true'
        run: echo "Docs-only change. The Compose E2E shard has nothing to run."
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        if: env.LEXON_RUN_E2E == 'true'
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        if: env.LEXON_RUN_E2E == 'true'
        with:
          version: 10.33.1
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        if: env.LEXON_RUN_E2E == 'true'
        with:
          node-version: 24.22.1
          cache: pnpm
      - if: env.LEXON_RUN_E2E == 'true'
        run: pnpm install --frozen-lockfile
      - if: env.LEXON_RUN_E2E == 'true'
        run: pnpm --filter @lexon/contracts build
      - name: Read the Playwright version
        id: playwright
        if: env.LEXON_RUN_E2E == 'true'
        run: printf 'version=%s\n' "$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"
      - name: Restore Playwright browsers
        id: playwright-cache
        if: env.LEXON_RUN_E2E == 'true'
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}-${{ steps.playwright.outputs.version }}
      - name: Install Chromium on a cache miss
        if: env.LEXON_RUN_E2E == 'true' && steps.playwright-cache.outputs.cache-hit != 'true'
        run: pnpm exec playwright install --with-deps chromium
      - name: Install Chromium system dependencies on a cache hit
        if: env.LEXON_RUN_E2E == 'true' && steps.playwright-cache.outputs.cache-hit == 'true'
        run: pnpm exec playwright install-deps chromium
      - name: Read visual approval status
        id: visual-approval
        if: env.LEXON_RUN_E2E == 'true'
        run: |
          visual_status="$(node -e 'const { readFileSync } = require("node:fs"); process.stdout.write(JSON.parse(readFileSync("docs/references/F4.1-visual/approval.json", "utf8")).status)')"
          printf 'status=%s\n' "$visual_status" >> "$GITHUB_OUTPUT"
      - name: Mark the start of this shard's visual output
        if: env.LEXON_RUN_E2E == 'true'
        run: |
          mkdir -p .cache
          touch .cache/shard-start
      - name: Full Compose browser API and topology layer
        if: env.LEXON_RUN_E2E == 'true'
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            if [ "${{ inputs.visual_mode }}" = "update" ]; then
              LEXON_VISUAL_MODE=update pnpm test:e2e --shard=${{ matrix.shard }}/3 --reporter=blob --update-snapshots
            elif [ "${{ inputs.visual_mode }}" = "capture" ]; then
              LEXON_VISUAL_MODE=capture pnpm test:e2e --shard=${{ matrix.shard }}/3 --reporter=blob
            else
              LEXON_VISUAL_MODE=compare pnpm test:e2e --shard=${{ matrix.shard }}/3 --reporter=blob
            fi
          else
            pnpm test:e2e --shard=${{ matrix.shard }}/3 --reporter=blob
          fi
      - name: Upload Playwright blob report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: blob-${{ github.run_id }}-${{ matrix.shard }}
          path: blob-report
          retention-days: 14
          if-no-files-found: ignore
      - name: Upload F4 chat preview captures
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: f4-chat-preview-${{ github.sha }}-shard-${{ matrix.shard }}
          path: |
            test-results/f4-chat/*.png
            test-results/f4-chat/*.json
          retention-days: 14
          if-no-files-found: ignore
      - name: Read pending visual list
        id: visual-pending
        if: always() && env.LEXON_RUN_E2E == 'true'
        run: |
          pending_count="$(node -e 'const { readFileSync } = require("node:fs"); process.stdout.write(String((JSON.parse(readFileSync("docs/references/F4.1-visual/index.json", "utf8")).pending ?? []).length))')"
          printf 'count=%s\n' "$pending_count" >> "$GITHUB_OUTPUT"
          # Only the pending views this shard captured (pending.txt is written by its capture helper).
          pending_ids="$(node -e 'const { existsSync, readFileSync } = require("node:fs"); const dir = "docs/references/F4.1-visual/"; const pending = new Set(JSON.parse(readFileSync(dir + "index.json", "utf8")).pending ?? []); const lines = existsSync(dir + "pending.txt") ? readFileSync(dir + "pending.txt", "utf8").split("\n").map((l) => l.trim()) : []; process.stdout.write([...new Set(lines.filter((l) => pending.has(l)).map((l) => l.replace(/-(desktop|mobile)-(light|dark)$/, "")))].join(","))')"
          printf 'ids=%s\n' "$pending_ids" >> "$GITHUB_OUTPUT"
      - name: Compare pending captures with the prototype
        if: always() && steps.visual-pending.outputs.ids != ''
        run: node scripts/visual-compare-prototype.mjs --pending --ids "${{ steps.visual-pending.outputs.ids }}" --capture-dir docs/references/F4.1-visual/review --out-dir docs/references/F4.1-visual/pending-compare
      - name: Upload pending visual captures
        if: always() && steps.visual-pending.outputs.ids != ''
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: visual-pending-${{ github.run_id }}-shard-${{ matrix.shard }}
          path: |
            docs/references/F4.1-visual/review/*.png
            docs/references/F4.1-visual/review/*.masks.json
            docs/references/F4.1-visual/pending.txt
            docs/references/F4.1-visual/pending-compare/*
            docs/references/F4.1-visual/pending-compare/results.json
          retention-days: 30
          if-no-files-found: error
      - name: Upload visual compare sheets
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: visual-compare-${{ github.run_id }}-shard-${{ matrix.shard }}
          path: |
            docs/references/F4.1-visual/compare/*
            docs/references/F4.1-visual/review/contact-sheets/*
          retention-days: 30
          if-no-files-found: ignore
      - name: Collect this shard's visual output
        if: always() && github.event_name == 'workflow_dispatch' && inputs.visual_mode != 'compare'
        run: |
          mkdir -p .cache/shard-visual
          cd docs/references/F4.1-visual
          find . -type f -newer "$GITHUB_WORKSPACE/.cache/shard-start" -print0 | xargs -0 -r cp --parents -t "$GITHUB_WORKSPACE/.cache/shard-visual"
      - name: Upload F4.1 Linux visual set
        if: always() && github.event_name == 'workflow_dispatch' && inputs.visual_mode != 'compare'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: f4.1-visual-${{ inputs.visual_mode }}-${{ github.sha }}-shard-${{ matrix.shard }}
          # Only the files this shard wrote, under one root: shards never overlap.
          path: .cache/shard-visual
          retention-days: 14
          if-no-files-found: ignore
      - name: Sanitized test artifacts
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: lexon-e2e-results-${{ github.run_id }}-shard-${{ matrix.shard }}
          path: test-results/
          retention-days: 7
          if-no-files-found: ignore
  merge-e2e:
    needs: [changes, compose-e2e]
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.docs_only != 'true') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      CI: true
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 10.33.1
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24.22.1
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: blob-*
          path: blob
          merge-multiple: true
      - name: Merge the shard reports
        run: npx playwright merge-reports --reporter html ./blob
      - name: Read pending visual list
        id: pending
        run: |
          pending_count="$(node -e 'const { readFileSync } = require("node:fs"); process.stdout.write(String((JSON.parse(readFileSync("docs/references/F4.1-visual/index.json", "utf8")).pending ?? []).length))')"
          printf 'count=%s\n' "$pending_count" >> "$GITHUB_OUTPUT"
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        if: steps.pending.outputs.count != '0'
        with:
          pattern: visual-pending-${{ github.run_id }}-shard-*
          path: pending-shards
      - name: Every pending view was captured by some shard
        if: steps.pending.outputs.count != '0'
        run: |
          node -e 'const { existsSync, readFileSync, readdirSync } = require("node:fs"); const pending = JSON.parse(readFileSync("docs/references/F4.1-visual/index.json", "utf8")).pending; const got = new Set(); if (existsSync("pending-shards")) for (const dir of readdirSync("pending-shards")) { const file = "pending-shards/" + dir + "/pending.txt"; if (existsSync(file)) for (const l of readFileSync(file, "utf8").split("\n")) got.add(l.trim()); } const missing = pending.filter((id) => !got.has(id)); if (missing.length > 0) { console.error("No shard captured pending views: " + missing.join(", ")); process.exit(1); }'
      - name: Upload merged Playwright report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: playwright-report-${{ github.run_id }}
          path: playwright-report
          retention-days: 14
          if-no-files-found: ignore
  visual-assemble:
    needs: compose-e2e
    if: ${{ !cancelled() && github.event_name == 'workflow_dispatch' && inputs.visual_mode != 'compare' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      CI: true
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 10.33.1
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24.22.1
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @lexon/contracts build
      - name: Read the Playwright version
        id: playwright
        run: printf 'version=%s\n' "$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"
      - name: Restore Playwright browsers
        id: playwright-cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}-${{ steps.playwright.outputs.version }}
      - name: Install Chromium on a cache miss
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: pnpm exec playwright install --with-deps chromium
      - name: Install Chromium system dependencies on a cache hit
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: pnpm exec playwright install-deps chromium
      - name: Record visual capture freshness marker
        if: inputs.visual_mode == 'capture'
        run: |
          node -e 'const { mkdirSync, writeFileSync } = require("node:fs"); mkdirSync(".cache/f4.1-visual", { recursive: true }); writeFileSync(".cache/f4.1-visual/start-epoch-ms.txt", `${Date.now()}\n`);'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: f4.1-visual-${{ inputs.visual_mode }}-${{ github.sha }}-shard-*
          path: .cache/shard-in
          merge-multiple: true
      - name: Merge the shard output into the visual set
        # Each shard uploaded only files newer than its own start marker, so a
        # copy (new mtime, no -p) marks exactly the views the shards captured.
        # A view no shard captured keeps its checkout time and fails the
        # freshness check; the check does not rely on artifact mtimes.
        run: |
          mkdir -p .cache/shard-in
          cp -R .cache/shard-in/. docs/references/F4.1-visual/
      - name: Write F4.1 visual capture manifest
        if: inputs.visual_mode == 'capture'
        run: |
          marker="$(cat .cache/f4.1-visual/start-epoch-ms.txt)"
          node scripts/test/visual-capture-manifest.mjs --set F4.1-visual --not-before "$marker"
      - name: Compare F4.1 captures with the prototype
        if: inputs.visual_mode == 'capture'
        run: node scripts/visual-compare-prototype.mjs --capture-dir docs/references/F4.1-visual/review --out-dir docs/references/F4.1-visual/compare
      - name: Verify F4.1 approved Linux baseline manifest
        if: inputs.visual_mode == 'update' && needs.compose-e2e.result == 'success'
        run: node scripts/test/write-visual-baseline-manifest.mjs --set F4.1-visual
      - name: Upload F4.1 Linux visual set
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: f4.1-visual-${{ inputs.visual_mode }}-${{ github.sha }}
          path: |
            docs/references/F4.1-visual/index.json
            docs/references/F4.1-visual/approval.json
            docs/references/F4.1-visual/capture-manifest.json
            docs/references/F4.1-visual/review/*.png
            docs/references/F4.1-visual/compare/*
            docs/references/F4.1-visual/baseline/*.png
            .cache/f4.1-visual/baseline-manifest.json
            .cache/f4.1-visual/start-epoch-ms.txt
          retention-days: 14
          if-no-files-found: ignore
