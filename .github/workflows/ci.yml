name: Lexon
on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      visual_mode:
        description: Visual comparison or explicit approved baseline update
        required: true
        type: choice
        options:
          - compare
          - update
        default: compare
permissions:
  contents: read
concurrency:
  group: lexon-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  unit-integration:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      CI: true
      NEXT_TELEMETRY_DISABLED: 1
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 10.33.1
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24.22.1
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Root lint and formatting
        run: pnpm lint && pnpm format:check
      - name: Package gates in dependency order
        run: |
          for package in contracts backend frontend evals; do
            pnpm --filter "@lexon/$package" lint
            pnpm --filter "@lexon/$package" build
            pnpm --filter "@lexon/$package" typecheck
          done
      - name: Unit and isolated Testcontainers integration
        run: pnpm test
      - name: Identity policy mutation gate
        run: pnpm --filter @lexon/backend test:mutation:identity
      - name: Tooling and cleanup assertions
        run: node --test scripts/test/*.spec.mjs
  compose-e2e:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      CI: true
      NEXT_TELEMETRY_DISABLED: 1
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 10.33.1
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24.22.1
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @lexon/contracts build
      - run: pnpm exec playwright install --with-deps chromium
      - name: Read visual approval status
        id: visual-approval
        run: |
          visual_status="$(node -e 'const { readFileSync } = require("node:fs"); process.stdout.write(JSON.parse(readFileSync("docs/references/F2.1-visual/approval.json", "utf8")).status)')"
          printf 'status=%s\n' "$visual_status" >> "$GITHUB_OUTPUT"
      - name: Full Compose browser API and topology layer
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            if [ "${{ inputs.visual_mode }}" = "update" ]; then
              LEXON_VISUAL_MODE=update pnpm test:e2e --update-snapshots
            else
              LEXON_VISUAL_MODE=compare pnpm test:e2e
            fi
          else
            pnpm test:e2e
          fi
      - name: Upload F4 chat preview captures
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: f4-chat-preview-${{ github.sha }}
          path: |
            test-results/f4-chat/*.png
            test-results/f4-chat/*.json
          retention-days: 14
          if-no-files-found: ignore
      - name: Verify exact approved Linux baseline manifest
        if: success() && github.event_name == 'workflow_dispatch'
        run: node scripts/test/write-visual-baseline-manifest.mjs
      - name: Save first Linux review capture hashes
        if: success() && github.event_name != 'workflow_dispatch' && github.ref == 'refs/heads/f2.1-visual-rework' && steps.visual-approval.outputs.status == 'awaiting-owner'
        run: node scripts/test/visual-capture-manifest.mjs --output .cache/f2.1-visual/capture-run-1.json
      - name: Repeat indexed review captures on the same Linux runner
        if: success() && github.event_name != 'workflow_dispatch' && github.ref == 'refs/heads/f2.1-visual-rework' && steps.visual-approval.outputs.status == 'awaiting-owner'
        run: |
          LEXON_VISUAL_MODE=capture pnpm test:e2e --project visual-review
          LEXON_VISUAL_MODE=capture pnpm test:e2e --project identity-browser -g 'F2 platform page passes both-theme axe checks in the real operator flow'
      - name: Compare both Linux review capture iterations
        if: success() && github.event_name != 'workflow_dispatch' && github.ref == 'refs/heads/f2.1-visual-rework' && steps.visual-approval.outputs.status == 'awaiting-owner'
        run: node scripts/test/visual-capture-manifest.mjs --compare .cache/f2.1-visual/capture-run-1.json
      - name: Write indexed visual review manifest
        if: success() && github.event_name != 'workflow_dispatch' && github.ref == 'refs/heads/f2.1-visual-rework' && steps.visual-approval.outputs.status == 'awaiting-owner'
        run: node scripts/test/visual-capture-manifest.mjs
      - name: Upload indexed Linux visual review set
        if: success() && github.ref == 'refs/heads/f2.1-visual-rework' && (github.event_name == 'workflow_dispatch' || steps.visual-approval.outputs.status == 'awaiting-owner')
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: f2.1-visual-review-${{ github.sha }}
          path: |
            docs/references/F2.1-visual/index.json
            docs/references/F2.1-visual/approval.json
            docs/references/F2.1-visual/capture-manifest.json
            docs/references/F2.1-visual/review/*.png
            docs/references/F2.1-visual/baseline/*.png
            .cache/f2.1-visual/baseline-manifest.json
          retention-days: 7
          if-no-files-found: error
      - name: Sanitized test artifacts
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: lexon-e2e-results
          path: test-results/
          retention-days: 7
          if-no-files-found: ignore
