name: Flake round
on:
  # F4.4 task 5: the pull_request trigger that ran the pre-merge round is
  # retired — the guarded spec files stay in this PR's diff, so it would
  # re-fire on every push. workflow_dispatch works once the file is on main.
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: flake-round-${{ github.ref }}
  cancel-in-progress: false
jobs:
  flake-round:
    # F4.4 task 5: 20 consecutive Linux passes for the A-12 margin tests and
    # the chat-scaffold refresh test. One dispatch is one cap unit.
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 10.33.1
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24.22.1
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Fresh checkouts have no built shared dist; without it vitest file
      # discovery in backend-integration returns zero files (and vite 8
      # crashes printing the error). Same pre-step the load wrapper runs.
      - run: pnpm exec tsc -p shared/tsconfig.build.json
      - name: ai-execution lease tests x20
        run: |
          set -e
          passes=0
          for i in $(seq 1 20); do
            pnpm exec vitest run --project backend-integration backend/test/integration/ai-execution.spec.ts -t 'renews through the bounded retry backoff|stops claim renewal'
            passes=$((passes + 1))
            echo "PASS $passes/20"
          done
          echo "backend ai-execution lease tests: $passes/20 passed"
      - name: chat-scaffold refresh test x20
        run: |
          set -e
          passes=0
          for i in $(seq 1 20); do
            pnpm exec vitest run --project frontend frontend/test/chat-scaffold.spec.tsx -t 'refreshes the canonical off-branch tree'
            passes=$((passes + 1))
            echo "PASS $passes/20"
          done
          echo "frontend chat-scaffold refresh test: $passes/20 passed"
  flake-round-e2e:
    # F4.5 task 6: 20 consecutive Linux passes for the two identity-browser
    # legs (items 1-2) on ONE kept shard-3 stack — brought up with the same
    # project selection and compose.chat-runtime-proof.yml retarget shard 3
    # uses, then queried through LEXON_E2E_DESCRIPTOR like the capture loop.
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 10.33.1
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24.22.1
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @lexon/contracts build
      - name: Read the Playwright version
        id: playwright
        run: printf 'version=%s\n' "$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"
      - name: Restore Playwright browsers
        id: playwright-cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}-${{ steps.playwright.outputs.version }}
      - name: Install Chromium on a cache miss
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: pnpm exec playwright install --with-deps chromium
      - name: Install Chromium system dependencies on a cache hit
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: pnpm exec playwright install-deps chromium
      # --list runs zero tests; LEXON_E2E_KEEP leaves the stack and writes
      # .cache/visual-capture-stack/descriptor.json. The project name must
      # match lexon-e2e-<hex>[-<shard>] (a run id is all digits).
      - name: Bring up the kept shard-3 stack
        run: LEXON_E2E_KEEP=1 LEXON_E2E_PROJECT=lexon-e2e-${{ github.run_id }}-4 node scripts/e2e.mjs --shard=3/3 --list
      - name: account-security TOTP enrollment x20
        run: |
          set -e
          export LEXON_E2E_DESCRIPTOR="$(cat .cache/visual-capture-stack/descriptor.json)"
          export LEXON_CHAT_LOAD=0
          export PLAYWRIGHT_NO_COPY_PROMPT=1
          export COMPOSE_PROFILES=''
          passes=0
          for i in $(seq 1 20); do
            node node_modules/@playwright/test/cli.js test --project=identity-browser backend/test/e2e/account-security.spec.ts -g 'security TOTP enrollment'
            passes=$((passes + 1))
            echo "PASS $passes/20"
          done
          echo "identity-browser account-security TOTP enrollment: $passes/20 passed"
      - name: platform-setup open sign-up x20
        run: |
          set -e
          export LEXON_E2E_DESCRIPTOR="$(cat .cache/visual-capture-stack/descriptor.json)"
          export LEXON_CHAT_LOAD=0
          export PLAYWRIGHT_NO_COPY_PROMPT=1
          export COMPOSE_PROFILES=''
          passes=0
          for i in $(seq 1 20); do
            node node_modules/@playwright/test/cli.js test --project=identity-browser backend/test/e2e/platform-setup-open-signup.spec.ts -g 'open sign-up'
            passes=$((passes + 1))
            echo "PASS $passes/20"
          done
          echo "identity-browser platform-setup open sign-up: $passes/20 passed"
      - if: always()
        run: node scripts/visual-capture-stack.mjs down
  flake-round-ai-cancel:
    # F4.5 task 6: 20 consecutive Linux passes for the ai-cancel integration
    # legs (item 3). Each vitest iteration pays its own Testcontainers
    # startup; LEXON_TEST_REUSE is never set in CI.
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 10.33.1
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24.22.1
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Fresh checkouts have no built shared dist; without it vitest file
      # discovery in backend-integration returns zero files (and vite 8
      # crashes printing the error). Same pre-step the load wrapper runs.
      - run: pnpm exec tsc -p shared/tsconfig.build.json
      - name: ai-cancel integration tests x20
        run: |
          set -e
          passes=0
          for i in $(seq 1 20); do
            pnpm exec vitest run --project backend-integration backend/test/integration/ai-cancel.spec.ts -t 'public cancel after lease expiry|cancelling a streaming model aborts'
            passes=$((passes + 1))
            echo "PASS $passes/20"
          done
          echo "backend ai-cancel integration tests: $passes/20 passed"
