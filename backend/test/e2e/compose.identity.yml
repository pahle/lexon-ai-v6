services:
  api:
    command: [node, backend/test/e2e/auth-api-main.mjs]
    volumes:
      - type: bind
        source: ${IDENTITY_TEST_ENTRY_PATH:?}
        target: /app/backend/test/e2e/auth-api-main.mjs
        read_only: true
      - type: bind
        source: ${IDENTITY_MAIL_CONTROL_PATH:?}
        target: /app/backend/test/e2e/mail-control.mjs
        read_only: true
  admin-setup:
    image: ${IDENTITY_SETUP_TEST_IMAGE:?}
    volumes:
      - type: bind
        source: ${IDENTITY_SETUP_TEST_ENTRY_PATH:?}
        target: /app/backend/test/e2e/admin-setup-main.mjs
        read_only: true
