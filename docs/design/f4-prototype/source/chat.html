<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lexon chat prototype</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap">
<style>
:root{--bg:#F6EFE2;--card:#EEE4D2;--pop:#F6EFE2;--muted:#E5D9C3;--border:#D8C9AD;--fg:#1F1717;--mfg:#5E5248;--primary:#7A1F2E;--primary-hover:#6A1A28;--pfg:#F6EFE2;--ring:#7A1F2E;--sidebar:#EEE4D2;--accent:#E5D9C3;--danger:#B42318;--danger-bg:rgba(180,35,24,.08);--success:#4E5A39;--mark:#FFF4C2;--shadow:0 10px 30px rgba(31,23,23,.14),0 1px 3px rgba(31,23,23,.08)}
:root[data-theme=dark]{--bg:#2A1519;--card:#3A1E24;--pop:#3A1E24;--muted:#4A2830;--border:#5A3A40;--fg:#F6EFE2;--mfg:#C9B9A6;--primary:#F6EFE2;--primary-hover:#E5D9C3;--pfg:#2A1519;--ring:#F6EFE2;--sidebar:#3A1E24;--accent:#4A2830;--danger:#F97066;--danger-bg:rgba(249,112,102,.12);--success:#A9B58F;--mark:rgba(246,239,226,.18);--shadow:0 0 0 1px var(--border)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font-family:Inter,system-ui,sans-serif;font-size:14px}
button{font:inherit;color:inherit}
input,textarea{font:inherit;color:var(--fg)}
.app{width:1440px;height:900px;display:flex;position:relative;overflow:hidden;background:var(--bg)}
.sb{width:256px;flex:none;background:var(--sidebar);border-right:1px solid var(--border);display:flex;flex-direction:column;padding:8px;gap:8px;position:relative}
.navbtn{all:unset;box-sizing:border-box;display:flex;align-items:center;gap:8px;width:100%;height:32px;padding:0 8px;border-radius:6px;cursor:pointer;font-size:14px;white-space:nowrap;overflow:hidden;position:relative}
.navbtn:hover{background:var(--accent)}
.navbtn.on{background:var(--accent);font-weight:500}
.navbtn .t{flex:1;overflow:hidden;text-overflow:ellipsis}
.navbtn .more{display:none;width:24px;height:24px;border-radius:4px;align-items:center;justify-content:center;color:var(--mfg)}
.navbtn.on .more,.navbtn:hover .more,.navbtn.menuopen .more{display:flex}
.big{height:48px}
.mlabel{padding:6px 8px;font-size:12px;color:var(--mfg)}
.iconbtn{all:unset;display:inline-flex;align-items:center;justify-content:center;width:28px;height:28px;border-radius:6px;cursor:pointer;color:var(--mfg)}
.iconbtn:hover{background:var(--accent);color:var(--fg)}
.iconbtn.on{color:var(--fg)}
.tile{width:32px;height:32px;border-radius:8px;flex:none;display:block}
.avatar{width:32px;height:32px;border-radius:50%;flex:none;display:flex;align-items:center;justify-content:center;background:var(--muted);font-size:12px;font-weight:500}
.menu{position:absolute;z-index:20;background:var(--pop);border:1px solid var(--border);border-radius:8px;box-shadow:var(--shadow);padding:4px;min-width:180px}
.mitem{all:unset;box-sizing:border-box;display:flex;align-items:center;gap:8px;width:100%;height:32px;padding:0 8px;border-radius:4px;cursor:pointer;font-size:14px}
.mitem:hover{background:var(--accent)}
.mitem.danger{color:var(--danger)}
.btn{all:unset;box-sizing:border-box;display:inline-flex;align-items:center;justify-content:center;gap:6px;height:32px;padding:0 12px;border-radius:8px;font-size:14px;font-weight:500;cursor:pointer}
.primary{background:var(--primary);color:var(--pfg)}
.outline{border:1px solid var(--border);background:var(--bg)}
.destructive-solid{background:var(--danger);color:#fff}
.main{flex:1;min-width:0;display:flex;flex-direction:column;position:relative}
header.top{height:56px;flex:none;display:flex;align-items:center;gap:8px;padding:0 16px}
.vsep{width:1px;height:16px;background:var(--border)}
.crumb{display:flex;align-items:center;gap:6px;font-size:14px;color:var(--mfg)}
.crumb b{color:var(--fg);font-weight:400}
.viewport{flex:1;min-height:0;overflow:hidden;display:flex;flex-direction:column;align-items:center}
.thread{width:100%;max-width:768px;padding:16px 24px 0;display:flex;flex-direction:column;gap:24px}
.umsg{align-self:flex-end;max-width:80%;display:flex;flex-direction:column;align-items:flex-end;gap:4px}
.ububble{background:var(--muted);border-radius:18px;padding:10px 16px;line-height:1.55;font-size:15px}
.amsg{display:flex;flex-direction:column;gap:8px;font-size:15px;line-height:1.65}
.amsg p{margin:0 0 10px}
.amsg ol,.amsg ul{margin:0 0 10px;padding-left:22px}
.amsg li{margin:2px 0}
.amsg h3{font-size:15px;margin:6px 0 6px;font-weight:600}
.bar{display:flex;align-items:center;gap:2px;color:var(--mfg)}
.branch{display:inline-flex;align-items:center;gap:2px;font-size:12px;color:var(--mfg)}
.think{all:unset;display:inline-flex;align-items:center;gap:6px;color:var(--mfg);font-size:14px;cursor:pointer}
.thinkbody{border-left:2px solid var(--border);padding:2px 0 2px 14px;color:var(--mfg);font-size:14px;line-height:1.6}
.shimmer{background:linear-gradient(90deg,var(--mfg) 0%,var(--fg) 50%,var(--mfg) 100%);-webkit-background-clip:text;background-clip:text;color:transparent}
.caret{display:inline-block;width:8px;height:16px;background:var(--fg);vertical-align:-2px;border-radius:2px;margin-left:2px}
.composerwrap{width:100%;max-width:768px;padding:12px 24px 12px;flex:none}
.composer{border:1px solid var(--border);border-radius:16px;background:var(--card);padding:12px;display:flex;flex-direction:column;gap:8px}
.composer textarea{border:0;outline:none;resize:none;background:transparent;font-size:15px;padding:4px;min-height:48px}
.composer textarea::placeholder{color:var(--mfg)}
.crow{display:flex;justify-content:space-between;align-items:center}
.pill{all:unset;box-sizing:border-box;display:inline-flex;align-items:center;gap:6px;height:32px;padding:0 12px;border-radius:999px;border:1px solid var(--border);font-size:13px;font-weight:500;cursor:pointer;color:var(--mfg)}
.pill[aria-pressed=true]{background:var(--primary);border-color:var(--primary);color:var(--pfg)}
.send{all:unset;display:inline-flex;align-items:center;justify-content:center;width:32px;height:32px;border-radius:999px;background:var(--primary);color:var(--pfg);cursor:pointer}
.send[aria-disabled=true]{opacity:.45}
.disclaimer{text-align:center;font-size:12px;color:var(--mfg);margin-top:8px}
.alert{border:1px solid var(--danger);background:var(--danger-bg);border-radius:10px;padding:12px 14px;display:flex;gap:10px;align-items:flex-start;color:var(--fg);font-size:14px}
.alert .ttl{font-weight:600;color:var(--danger)}
.note{font-size:13px;color:var(--mfg);display:flex;align-items:center;gap:6px}
.overlay{position:absolute;inset:0;background:rgba(20,10,12,.45);z-index:30}
.dialog{position:absolute;z-index:31;left:50%;top:50%;transform:translate(-50%,-50%);width:440px;background:var(--bg);border:1px solid var(--border);border-radius:14px;box-shadow:var(--shadow);padding:24px;display:flex;flex-direction:column;gap:8px}
.dialog h2{margin:0;font-size:18px;font-weight:600}
.dialog p{margin:0;color:var(--mfg);line-height:1.5}
.toast{position:absolute;right:24px;bottom:24px;z-index:40;background:var(--pop);border:1px solid var(--border);border-radius:10px;box-shadow:var(--shadow);padding:12px 16px;display:flex;gap:8px;align-items:center;font-size:14px;width:320px}
.inp{height:36px;width:100%;border:1px solid var(--border);border-radius:8px;background:transparent;padding:0 12px;font-size:14px;outline:none}
.inp:focus,.inp.focus{border-color:var(--ring);box-shadow:0 0 0 3px color-mix(in srgb,var(--ring) 22%,transparent)}
.renameinp{height:28px;border:1px solid var(--ring);border-radius:6px;background:var(--bg);padding:0 8px;font-size:14px;width:100%;outline:none;box-shadow:0 0 0 3px color-mix(in srgb,var(--ring) 22%,transparent)}
.hist{width:100%;max-width:768px;padding:8px 24px;display:flex;flex-direction:column;gap:16px}
.hrow{display:flex;flex-direction:column;gap:4px;padding:12px;border-radius:10px;border:1px solid transparent}
.hrow:hover,.hrow.hl{background:var(--card);border-color:var(--border)}
.hrow .ht{display:flex;justify-content:space-between;gap:16px;font-weight:500}
.hrow .hd{font-size:12px;color:var(--mfg);font-weight:400;white-space:nowrap}
.hrow .hs{font-size:13px;color:var(--mfg);line-height:1.5}
mark{background:var(--mark);color:inherit;border-radius:3px;padding:0 2px}
.empty{display:flex;flex-direction:column;align-items:center;gap:8px;padding:64px 0;color:var(--mfg);text-align:center}
.empty .ic{width:40px;height:40px;border-radius:10px;background:var(--muted);display:flex;align-items:center;justify-content:center;color:var(--fg)}
.empty h2{margin:0;font-size:16px;color:var(--fg);font-weight:600}
.edit{align-self:stretch;margin-left:20%;border:1px solid var(--ring);border-radius:16px;background:var(--card);padding:12px;display:flex;flex-direction:column;gap:8px;box-shadow:0 0 0 3px color-mix(in srgb,var(--ring) 18%,transparent)}
.edit textarea{border:0;outline:none;resize:none;background:transparent;font-size:15px;line-height:1.55;min-height:56px}
.tipbox{position:absolute;background:var(--fg);color:var(--bg);font-size:12px;padding:4px 8px;border-radius:6px;white-space:nowrap;z-index:25}
.skel{height:12px;border-radius:6px;background:var(--muted)}
.picker{position:fixed;left:0;right:0;bottom:0;background:#111;color:#eee;font:12px system-ui;padding:6px 10px;display:flex;flex-wrap:wrap;gap:6px;z-index:100}
.picker a{color:#eee;text-decoration:none;padding:2px 6px;border:1px solid #444;border-radius:4px}
.picker a.cur{background:#7A1F2E;border-color:#7A1F2E}
</style>
</head>
<body>
<div id="root"></div>
<script>
const TILE = '__TILE__';
const P = new URLSearchParams(location.search);
const S = P.get('s') || 'home';
if (P.get('theme') === 'dark') document.documentElement.dataset.theme = 'dark';

const ic = {
  plus:'<path d="M12 5v14M5 12h14"/>',
  home:'<path d="M15 21v-8a1 1 0 0 0-1-1h-4a1 1 0 0 0-1 1v8"/><path d="M3 10a2 2 0 0 1 .7-1.5l7-6a2 2 0 0 1 2.6 0l7 6A2 2 0 0 1 21 10v9a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/>',
  chats:'<path d="M14 9a2 2 0 0 1-2 2H6l-4 4V4a2 2 0 0 1 2-2h8a2 2 0 0 1 2 2z"/><path d="M18 9h2a2 2 0 0 1 2 2v11l-4-4h-6a2 2 0 0 1-2-2v-1"/>',
  newchat:'<path d="M12 3H5a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.4 2.6a2 2 0 1 1 3 3L12 15l-4 1 1-4Z"/>',
  dots:'<circle cx="12" cy="12" r="1"/><circle cx="19" cy="12" r="1"/><circle cx="5" cy="12" r="1"/>',
  chev:'<path d="m7 15 5 5 5-5"/><path d="m7 9 5-5 5 5"/>',
  panel:'<rect x="3" y="3" width="18" height="18" rx="2"/><path d="M9 3v18"/>',
  copy:'<rect width="14" height="14" x="8" y="8" rx="2"/><path d="M4 16c-1.1 0-2-.9-2-2V4c0-1.1.9-2 2-2h10c1.1 0 2 .9 2 2"/>',
  check:'<path d="M20 6 9 17l-5-5"/>',
  up:'<path d="M7 10v12"/><path d="M15 5.9 14 10h5.8a2 2 0 0 1 1.9 2.6l-2.3 8A2 2 0 0 1 17.4 22H4a2 2 0 0 1-2-2v-8a2 2 0 0 1 2-2h2.8a2 2 0 0 0 1.8-1.1L12 2a3.1 3.1 0 0 1 3 3.9Z"/>',
  down:'<path d="M17 14V2"/><path d="M9 18.1 10 14H4.2a2 2 0 0 1-1.9-2.6l2.3-8A2 2 0 0 1 6.6 2H20a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2h-2.8a2 2 0 0 0-1.8 1.1L12 22a3.1 3.1 0 0 1-3-3.9Z"/>',
  regen:'<path d="M3 12a9 9 0 0 1 9-9 9.8 9.8 0 0 1 6.7 2.7L21 8"/><path d="M21 3v5h-5"/><path d="M21 12a9 9 0 0 1-9 9 9.8 9.8 0 0 1-6.7-2.7L3 16"/><path d="M8 16H3v5"/>',
  pencil:'<path d="M21.2 6.8a1 1 0 0 0-4-4L3.8 16.2a2 2 0 0 0-.5.8l-1.3 4.4a.5.5 0 0 0 .6.6l4.4-1.3a2 2 0 0 0 .8-.5z"/>',
  left:'<path d="m15 18-6-6 6-6"/>', right:'<path d="m9 18 6-6-6-6"/>',
  arrowup:'<path d="m5 12 7-7 7 7"/><path d="M12 19V5"/>',
  stop:'<rect x="7" y="7" width="10" height="10" rx="1.5" fill="currentColor" stroke="none"/>',
  brain:'<path d="M12 18V5"/><path d="M15 13a4.2 4.2 0 0 1-3-4 4.2 4.2 0 0 1-3 4"/><path d="M17.6 6.5A3 3 0 0 0 18 5a3 3 0 1 0-6 0 3 3 0 1 0-6 0 3 3 0 0 0 .4 1.5"/><path d="M18 5.1A4 4 0 0 1 20.5 11"/><path d="M18 18a4 4 0 0 0 2-7.5"/><path d="M19.97 17.5A4 4 0 1 1 12 18a4 4 0 1 1-7.97-.5"/><path d="M6 18a4 4 0 0 1-2-7.5"/><path d="M6 5.1A4 4 0 0 0 3.5 11"/>',
  chevdown:'<path d="m6 9 6 6 6-6"/>', chevright:'<path d="m9 18 6-6-6-6"/>',
  alert:'<circle cx="12" cy="12" r="10"/><path d="M12 8v4M12 16h.01"/>',
  search:'<circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/>',
  trash:'<path d="M3 6h18"/><path d="M19 6v14c0 1-1 2-2 2H7c-1 0-2-1-2-2V6"/><path d="M8 6V4c0-1 1-2 2-2h4c1 0 2 1 2 2v2"/>',
  x:'<path d="M18 6 6 18M6 6l12 12"/>',
  square:'<rect x="4" y="4" width="16" height="16" rx="2"/>',
  wifi:'<path d="M12 20h.01"/><path d="M8.5 16.4a5 5 0 0 1 7 0"/><path d="M2 8.8a15 15 0 0 1 20 0"/><path d="M5 12.9a10 10 0 0 1 14 0"/>'
};
const svg = (n, s = 16, extra = '') => `<svg aria-hidden="true" width="${s}" height="${s}" viewBox="0 0 24 24" fill="${n==='up-f'?'currentColor':'none'}" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" ${extra}>${ic[n]}</svg>`;

const chats = [
  { id:'a', t:'Syarat sah perjanjian (Pasal 1320)', g:'Today' },
  { id:'b', t:'Due diligence checklist for PT acquisition', g:'Today' },
  { id:'c', t:'PKWT vs PKWTT after the Job Creation Law', g:'Yesterday' },
  { id:'d', t:'Force majeure clause, supply agreement', g:'Previous 7 days' },
  { id:'e', t:'Wanprestasi remedies and damages', g:'Previous 7 days' },
  { id:'f', t:'Data transfer under UU PDP Article 56', g:'Previous 7 days' },
];

const conf = {
  home:{}, thread:{active:'a'}, feedback:{active:'a'}, streaming:{active:'a'}, thinking:{active:'a'}, reasoning:{active:'a'}, deep:{active:null},
  edit:{active:'a'}, branch:{active:'a'}, error:{active:'a'}, stopped:{active:'a'}, reconnect:{active:'a'},
  menu:{active:'a', menu:'b'}, rename:{active:'a', rename:'b'}, delete:{active:'a', menu:null}, history:{page:'chats'},
  search:{page:'chats'}, noresults:{page:'chats'}, loading:{active:'a'}, empty:{page:'chats', none:true}
}[S] || {};

function sidebar() {
  const groups = conf.none ? '' : (() => {
    let out = '<div class="mlabel" style="padding:8px 8px 4px">Recent</div>';
    for (const c of chats.slice(0, 6)) {
      const on = conf.active === c.id && !conf.page;
      if (conf.rename === c.id) {
        out += `<div style="padding:2px 4px"><input class="renameinp" aria-label="Chat title" value="Due diligence: PT acquisition"></div>`;
        continue;
      }
      out += `<div style="position:relative"><button class="navbtn ${on?'on':''} ${conf.menu===c.id?'menuopen':''}" ${on?'aria-current="page"':''}><span class="t">${c.t}</span><span class="more" aria-label="Chat actions">${svg('dots')}</span></button>`;
      if (conf.menu === c.id) out += `<div class="menu" role="menu" style="top:30px;right:0;min-width:160px"><button class="mitem">${svg('pencil')}Rename</button><button class="mitem danger">${svg('trash')}Delete</button></div>`;
      out += '</div>';
    }
    out += `<button class="navbtn" style="color:var(--mfg)"><span class="t">View all chats</span></button>`;
    return out;
  })();
  return `<aside class="sb" aria-label="Sidebar">
    <button class="navbtn big"><img class="tile" src="${TILE}" alt="" width="32" height="32">
      <span style="display:flex;flex-direction:column;min-width:0;flex:1;line-height:1.25"><span style="font-weight:600">Hukum Nusantara</span><span style="font-size:12px;color:var(--mfg)">Owner</span></span>
      <span style="color:var(--mfg)">${svg('chev')}</span></button>
    <nav aria-label="Workspace" style="display:flex;flex-direction:column;gap:2px">
      <div class="mlabel" style="padding:8px 8px 4px">Workspace</div>
      <button class="navbtn ${(S==='home'||S==='deep')?'on':''}">${svg('newchat')}<span>New chat</span><span style="margin-left:auto;font-size:12px;color:var(--mfg)">Ctrl Shift O</span></button>
      <button class="navbtn ${conf.page==='chats'?'on':''}">${svg('chats')}<span>Chats</span></button>
    </nav>
    <div style="display:flex;flex-direction:column;gap:2px;min-height:0">${conf.none ? '<div class="mlabel" style="padding:8px 8px 4px">Recent</div><p style="margin:0;padding:4px 8px;font-size:13px;color:var(--mfg)">No chats yet.</p>' : groups}</div>
    <div style="margin-top:auto"><button class="navbtn big"><span class="avatar">AW</span>
      <span style="display:flex;flex-direction:column;min-width:0;flex:1;line-height:1.25"><span style="font-weight:500">Ayu Wardani</span><span style="font-size:12px;color:var(--mfg)">ayu@hukum-nusantara.co.id</span></span>
      <span style="color:var(--mfg)">${svg('chev')}</span></button></div>
  </aside>`;
}

function topbar(title) {
  return `<header class="top"><button class="iconbtn" aria-label="Toggle sidebar">${svg('panel')}</button><div class="vsep"></div>
  <nav aria-label="Breadcrumb" class="crumb">${title}</nav></header>`;
}

function composer({ deep = false, streaming = false, text = '', disabled = false } = {}) {
  const sendBtn = streaming
    ? `<button class="send" aria-label="Stop generating">${svg('stop')}</button>`
    : `<button class="send" aria-label="Send message" ${text?'':'aria-disabled="true"'}>${svg('arrowup')}</button>`;
  return `<div class="composerwrap"><div class="composer">
    <label for="composer" style="position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)">Message</label>
    <textarea id="composer" rows="2" placeholder="${streaming?'Lexon is answering…':'Ask Lexon about a contract, a regulation, or a case…'}">${text}</textarea>
    <div class="crow"><span style="position:relative;display:inline-flex"><button class="pill" aria-pressed="${deep}" aria-describedby="deep-tip">${svg('brain')}Deep thinking</button>${deep&&!text.startsWith('x')&&S==='deep'?'<span class="tipbox" id="deep-tip" role="tooltip" style="top:40px;left:0">Deep thinking: takes longer and uses more of your budget</span>':''}</span>${sendBtn}</div>
  </div><div class="disclaimer">Lexon can make mistakes. Verify important legal information.</div></div>`;
}

const Q1 = 'Apa saja syarat sahnya perjanjian menurut KUHPerdata, dan apa akibatnya jika salah satu syarat tidak terpenuhi?';
const A1 = `<p>Pasal 1320 KUHPerdata menetapkan empat syarat sahnya perjanjian:</p>
<ol><li><b>Kesepakatan</b> para pihak yang mengikatkan dirinya.</li><li><b>Kecakapan</b> untuk membuat suatu perikatan.</li><li><b>Suatu hal tertentu</b> sebagai objek perjanjian.</li><li><b>Suatu sebab yang halal</b>.</li></ol>
<h3>Akibat jika syarat tidak terpenuhi</h3>
<ul><li>Syarat 1 dan 2 adalah <b>syarat subjektif</b>. Jika tidak terpenuhi, perjanjian <b>dapat dibatalkan</b> atas permintaan pihak yang dirugikan; selama belum dibatalkan, perjanjian tetap mengikat.</li>
<li>Syarat 3 dan 4 adalah <b>syarat objektif</b>. Jika tidak terpenuhi, perjanjian <b>batal demi hukum</b>, dianggap tidak pernah ada sejak semula.</li></ul>`;
const A1b = `<p>Singkatnya, ada dua syarat subjektif (kesepakatan dan kecakapan) dan dua syarat objektif (hal tertentu dan sebab yang halal) dalam Pasal 1320 KUHPerdata.</p><p>Pelanggaran syarat subjektif membuat perjanjian dapat dibatalkan; pelanggaran syarat objektif membuatnya batal demi hukum.</p>`;

function umsg(text, { branch = false, editHover = false } = {}) {
  return `<div class="umsg"><div class="ububble">${text}</div><div class="bar" style="${editHover?'':'opacity:0'}">${branch?`<span class="branch"><button class="iconbtn" aria-label="Previous version">${svg('left',14)}</button>2 / 2<button class="iconbtn" aria-label="Next version" aria-disabled="true" style="opacity:.4">${svg('right',14)}</button></span>`:''}<button class="iconbtn" aria-label="Copy">${svg('copy',14)}</button><button class="iconbtn" aria-label="Edit message">${svg('pencil',14)}</button></div></div>`;
}
function abar({ fb = null, branch = false, copied = false } = {}) {
  return `<div class="bar">${branch?`<span class="branch"><button class="iconbtn" aria-label="Previous answer">${svg('left',14)}</button>2 / 2<button class="iconbtn" aria-label="Next answer" style="opacity:.4">${svg('right',14)}</button></span>`:''}
  <button class="iconbtn ${copied?'on':''}" aria-label="Copy">${svg(copied?'check':'copy',16)}</button>
  <button class="iconbtn ${fb==='up'?'on':''}" aria-label="Good response" aria-pressed="${fb==='up'}" style="${fb==='up'?'color:var(--primary)':''}">${svg('up',16, fb==='up'?'fill="currentColor"':'')}</button>
  <button class="iconbtn" aria-label="Bad response" aria-pressed="false">${svg('down',16)}</button>
  <button class="iconbtn" aria-label="Regenerate">${svg('regen',16)}</button></div>`;
}
function thought(open, label = 'Thought for 14 seconds') {
  return `<button class="think" aria-expanded="${open}">${svg('brain',16)}<span>${label}</span>${svg(open?'chevdown':'chevright',14)}</button>` +
    (open ? `<div class="thinkbody">The user asks about Article 1320 of the Indonesian Civil Code. List the four conditions, then separate subjective from objective conditions and explain voidable versus void by law. Keep it concise and cite the article.</div>` : '');
}

function threadScreen() {
  let body = '', comp = composer(), toast = '';
  const title = `<span>Chats</span>${svg('chevright',14)}<b>Syarat sah perjanjian (Pasal 1320)</b>`;
  switch (S) {
    case 'thinking':
      body = umsg(Q1) + `<div class="amsg"><div><button class="think" aria-expanded="false">${svg('brain',16)}<span class="shimmer">Thinking…</span>${svg('chevright',14)}</button></div></div>`;
      comp = composer({ streaming: true }); break;
    case 'streaming':
      body = umsg(Q1) + `<div class="amsg"><div>${thought(false,'Thought for 8 seconds')}</div><p>Pasal 1320 KUHPerdata menetapkan empat syarat sahnya perjanjian:</p><ol><li><b>Kesepakatan</b> para pihak yang mengikatkan dirinya.</li><li><b>Kecakapan</b> untuk membuat suatu<span class="caret"></span></li></ol></div>`;
      comp = composer({ streaming: true }); break;
    case 'reasoning':
      body = umsg(Q1) + `<div class="amsg"><div>${thought(true)}</div>${A1}${abar()}</div>`; break;
    case 'feedback':
      body = umsg(Q1) + `<div class="amsg"><div>${thought(false)}</div>${A1}${abar({ fb: 'up', copied: true })}</div>`;
      toast = `<div class="toast" role="status">${svg('check')}<span>Thanks for your feedback.</span></div>`; break;
    case 'edit':
      body = `<div class="edit"><label for="em" style="position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)">Edit message</label><textarea id="em">Apa saja syarat sahnya perjanjian menurut KUHPerdata? Jawab singkat.</textarea><div style="display:flex;justify-content:flex-end;gap:8px"><button class="btn outline">Cancel</button><button class="btn primary">Send</button></div></div>` + `<div class="amsg" style="opacity:.5"><div>${thought(false)}</div>${A1}</div>`; break;
    case 'branch':
      body = umsg('Apa saja syarat sahnya perjanjian menurut KUHPerdata? Jawab singkat.', { branch: true, editHover: true }) + `<div class="amsg"><div>${thought(false,'Thought for 6 seconds')}</div>${A1b}${abar()}</div>`; break;
    case 'error':
      body = umsg(Q1) + `<div class="amsg"><p>Pasal 1320 KUHPerdata menetapkan empat syarat sahnya perjanjian:</p><div class="alert" role="alert">${svg('alert',18,'style="color:var(--danger);flex:none;margin-top:1px"')}<div style="flex:1"><div class="ttl">The answer could not be completed</div><div style="color:var(--mfg);margin-top:2px">The AI service is temporarily unavailable. Your message is saved; try again in a moment.</div></div><button class="btn outline" style="flex:none">${svg('regen',14)}Try again</button></div></div>`; break;
    case 'stopped':
      body = umsg(Q1) + `<div class="amsg"><div>${thought(false,'Thought for 9 seconds')}</div><p>Pasal 1320 KUHPerdata menetapkan empat syarat sahnya perjanjian:</p><ol><li><b>Kesepakatan</b> para pihak yang mengikatkan dirinya.</li><li><b>Kecakapan</b> untuk membuat suatu</li></ol><div class="note">${svg('square',14)}Stopped</div>${abar()}</div>`; break;
    case 'reconnect':
      body = umsg(Q1) + `<div class="amsg"><div><button class="think">${svg('brain',16)}<span class="shimmer">Thinking…</span></button></div><p>Pasal 1320 KUHPerdata menetapkan empat syarat sahnya perjanjian:</p><div class="note" role="status">${svg('wifi',14)}Connection lost. Reconnecting…</div></div>`;
      comp = composer({ streaming: true }); break;
    case 'loading':
      body = `<div style="align-self:flex-end;width:55%;display:flex;flex-direction:column;gap:8px;align-items:flex-end"><div class="skel" style="width:100%;height:40px;border-radius:18px"></div></div><div style="display:flex;flex-direction:column;gap:10px"><div class="skel" style="width:90%"></div><div class="skel" style="width:75%"></div><div class="skel" style="width:82%"></div><div class="skel" style="width:40%"></div></div>`; break;
    default:
      body = umsg(Q1) + `<div class="amsg"><div>${thought(false)}</div>${A1}${abar()}</div>`;
  }
  return `<div class="main">${topbar(title)}<div class="viewport"><div style="flex:1;width:100%;display:flex;justify-content:center;overflow:hidden"><div class="thread"><h1 style="position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)">Syarat sah perjanjian (Pasal 1320)</h1>${body}</div></div>${comp}</div>${toast}</div>`;
}

function homeScreen() {
  const deep = S === 'deep';
  const text = deep ? 'Bandingkan risiko PKWT dan PKWTT untuk karyawan proyek konstruksi 18 bulan, termasuk kompensasi saat kontrak berakhir.' : '';
  return `<div class="main">${topbar('<b>New chat</b>')}<div class="viewport" style="justify-content:center;gap:24px;padding:24px">
    <h1 style="position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)">New chat</h1>
    <div style="width:100%;max-width:768px;display:flex;flex-direction:column;gap:4px;padding:0 24px"><p style="margin:0;font-family:Georgia,'Times New Roman',serif;font-size:28px;font-weight:600">Welcome, Ayu</p><p style="margin:0;color:var(--mfg);font-size:15px">Your legal workspace, ready when you are.</p></div>
    ${composer({ deep, text })}
  </div></div>`;
}

function historyScreen() {
  const q = S === 'search' ? 'wanprestasi' : S === 'noresults' ? 'hak tanggungan' : '';
  let list = '';
  if (S === 'empty') {
    list = `<div class="empty"><div class="ic">${svg('chats',20)}</div><h2>No chats yet</h2><p style="margin:0">Start a new chat to ask Lexon about a contract, a regulation, or a case.</p><button class="btn primary" style="margin-top:8px">${svg('newchat')}New chat</button></div>`;
  } else if (S === 'noresults') {
    list = `<div class="empty"><div class="ic">${svg('search',20)}</div><h2>No chats match “hak tanggungan”</h2><p style="margin:0">Search looks in chat titles and messages. Try other words.</p><button class="btn outline" style="margin-top:8px">Clear search</button></div>`;
  } else if (S === 'search') {
    list = `<p style="margin:0;font-size:13px;color:var(--mfg)">3 chats</p>
    <div class="hrow hl"><div class="ht"><span><mark>Wanprestasi</mark> remedies and damages</span><span class="hd">Nov 4</span></div><div class="hs">…debitur yang melakukan <mark>wanprestasi</mark> dapat dituntut pemenuhan perikatan, ganti rugi, atau pembatalan perjanjian berdasarkan Pasal 1267…</div></div>
    <div class="hrow"><div class="ht"><span>Force majeure clause, supply agreement</span><span class="hd">Nov 5</span></div><div class="hs">…keadaan memaksa membebaskan debitur dari tanggung jawab atas <mark>wanprestasi</mark> jika peristiwa tidak dapat diduga dan bukan karena kesalahannya…</div></div>
    <div class="hrow"><div class="ht"><span>Syarat sah perjanjian (Pasal 1320)</span><span class="hd">Today</span></div><div class="hs">…berbeda dengan <mark>wanprestasi</mark>, cacat pada syarat subjektif membuat perjanjian dapat dibatalkan…</div></div>`;
  } else {
    let g = '';
    for (const c of chats) {
      if (c.g !== g) { g = c.g; list += `<div class="mlabel" style="padding:8px 12px 0">${g}</div>`; }
      list += `<div class="hrow"><div class="ht"><span>${c.t}</span><span class="hd">${c.g==='Today'?'10:42':c.g==='Yesterday'?'Yesterday':'Nov 4'}</span></div></div>`;
    }
  }
  return `<div class="main">${topbar('<b>Chats</b>')}<div class="viewport"><div class="hist">
    <div style="display:flex;justify-content:space-between;align-items:center"><h1 style="margin:0;font-size:22px;font-weight:600">Chats</h1><button class="btn primary">${svg('newchat')}New chat</button></div>
    <div style="position:relative"><span style="position:absolute;left:12px;top:10px;color:var(--mfg)">${svg('search')}</span><input class="inp ${q?'focus':''}" style="padding-left:36px" aria-label="Search chats" placeholder="Search chats" value="${q}"></div>
    ${list}</div></div></div>`;
}

function deleteDialog() {
  return `<div class="overlay"></div><div class="dialog" role="alertdialog" aria-modal="true" aria-labelledby="dt"><h2 id="dt">Delete this chat?</h2><p>“Due diligence checklist for PT acquisition” and all its messages will be permanently deleted. This cannot be undone.</p><div style="display:flex;justify-content:flex-end;gap:8px;margin-top:16px"><button class="btn outline">Cancel</button><button class="btn destructive-solid">Delete</button></div></div>`;
}

let mainHtml = conf.page === 'chats' ? historyScreen() : (S === 'home' || S === 'deep') ? homeScreen() : threadScreen();
document.getElementById('root').innerHTML = `<div class="app">${sidebar()}${mainHtml}${S==='delete'?deleteDialog():''}</div>` +
  (P.get('shot') ? '' : `<div class="picker">${Object.keys({home:1,deep:1,thinking:1,streaming:1,reasoning:1,thread:1,feedback:1,edit:1,branch:1,stopped:1,error:1,reconnect:1,loading:1,menu:1,rename:1,delete:1,history:1,search:1,noresults:1,empty:1}).map(k=>`<a class="${k===S?'cur':''}" href="?s=${k}${P.get('theme')==='dark'?'&theme=dark':''}">${k}</a>`).join('')}<a href="?s=${S}${P.get('theme')==='dark'?'':'&theme=dark'}">${P.get('theme')==='dark'?'light':'dark'}</a></div>`);
</script>
</body>
</html>
