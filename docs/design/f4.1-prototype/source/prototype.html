/* Layout: 1440x900 app canvas scaled to fit; tokens = brand kit v4.1 light + Claude-derived dark (owner review). */
:root{
  --bg:#FFFFFF;--fg:#1A1718;--card:#FFFFFF;--pop:#FFFFFF;--muted:#F5F4F4;--mfg:#6B6567;--accent:#F2F1F1;
  --border:#ECEAEA;--input:#DDDADA;--primary:#B3202A;--pfg:#FFFFFF;--ring:#B3202A;--deep:#8E1A22;
  --sidebar:#F5F4F4;--sb-accent:#ECEAEA;--sb-border:#E6E4E4;--sb-primary:#1A1718;--sb-pfg:#FFFFFF;
  --tint:#F7E6E8;--flag:#FBF1F2;--deleted:#9A9495;--redtext:#B3202A;--bubble:#F5F4F4;--overlay:rgba(8,6,6,.45);
  --shadow:0 0 0 1px rgba(26,23,24,.08),0 16px 40px -12px rgba(8,6,6,.22);--mark:#F7E6E8;
  --sans:"Lexon Inter",system-ui,-apple-system,"Segoe UI",sans-serif;--serif:"Lexon Garamond",Georgia,serif;--doc:"Lexon Bonum","Bookman Old Style",Georgia,serif;
  --chrome:#EFEEEE;--chrome-fg:#1A1718;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#121011;--fg:#F2F0F0;--card:#1A1718;--pop:#1A1718;--muted:#242021;--mfg:#A69FA1;--accent:#242021;
  --border:#2C2829;--input:#57504F;--primary:#B3202A;--pfg:#FFFFFF;--ring:#F0646C;--deep:#8E1A22;
  --sidebar:#181516;--sb-accent:#2A2627;--sb-border:#2C2829;--sb-primary:#F2F0F0;--sb-pfg:#121011;
  --tint:#3A1A1E;--flag:#2A1517;--deleted:#7D7678;--redtext:#F0646C;--bubble:#242021;--overlay:rgba(0,0,0,.6);
  --shadow:0 0 0 1px #2C2829,0 16px 40px -12px #000;--mark:#4A1E23;--chrome:#080606;--chrome-fg:#F2F0F0;color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#121011;--fg:#F2F0F0;--card:#1A1718;--pop:#1A1718;--muted:#242021;--mfg:#A69FA1;--accent:#242021;
  --border:#2C2829;--input:#57504F;--primary:#B3202A;--pfg:#FFFFFF;--ring:#F0646C;--deep:#8E1A22;
  --sidebar:#181516;--sb-accent:#2A2627;--sb-border:#2C2829;--sb-primary:#F2F0F0;--sb-pfg:#121011;
  --tint:#3A1A1E;--flag:#2A1517;--deleted:#7D7678;--redtext:#F0646C;--bubble:#242021;--overlay:rgba(0,0,0,.6);
  --shadow:0 0 0 1px #2C2829,0 16px 40px -12px #000;--mark:#4A1E23;--chrome:#080606;--chrome-fg:#F2F0F0;color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--chrome);color:var(--fg);font-family:var(--sans);font-size:14px;padding-block:12px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
body.shot{padding:0;background:var(--bg)}
button,input,textarea{font:inherit;color:inherit}
.picker{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-bottom:12px;color:var(--chrome-fg)}
.picker b{margin-right:4px;font-weight:600}
.picker a{color:var(--chrome-fg);text-decoration:none;padding:3px 9px;border:1px solid var(--input);border-radius:6px;font-size:12px;background:var(--bg)}
.picker a.cur{background:var(--primary);border-color:var(--primary);color:#fff}
.picker a:focus-visible{outline:2px solid var(--ring);outline-offset:2px}
.stage{overflow:hidden;border-radius:10px;box-shadow:0 0 0 1px var(--input)}
body.shot .stage{border-radius:0;box-shadow:none}
.app{width:1440px;height:900px;display:flex;position:relative;overflow:hidden;background:var(--sidebar);transform-origin:0 0}
.app.mobile,.app.plain{background:var(--bg)}
.app.mobile{width:390px;height:844px}
/* sidebar-07 */
.sb{width:256px;flex:none;background:var(--sidebar);display:flex;flex-direction:column;padding:8px;gap:4px;position:relative}
.sb.icon{width:49px}
.nb{all:unset;box-sizing:border-box;display:flex;align-items:center;gap:8px;width:100%;height:32px;padding:0 8px;border-radius:6px;cursor:pointer;font-size:14px;white-space:nowrap;overflow:hidden;position:relative;color:var(--fg)}
.nb:hover{background:var(--sb-accent)}.nb.on{background:var(--sb-accent);font-weight:500}
.nb .t{flex:1;overflow:hidden;text-overflow:ellipsis}.nb svg{flex:none}
.nb .more{display:none;width:24px;height:24px;border-radius:4px;align-items:center;justify-content:center;color:var(--mfg)}
.nb.on .more,.nb.menuopen .more{display:flex}
.big{height:48px}
.sub{margin-left:15px;padding-left:10px;border-left:1px solid var(--sb-border);display:flex;flex-direction:column;gap:1px}
.sub .nb{height:28px}
.glabel{padding:14px 8px 6px;font-size:12px;color:var(--mfg);font-weight:500}
.ini{width:32px;height:32px;border-radius:8px;flex:none;display:flex;align-items:center;justify-content:center;background:var(--sb-primary);color:var(--sb-pfg);font-size:12px;font-weight:600;letter-spacing:.02em}
.avatar{width:32px;height:32px;border-radius:8px;flex:none;display:flex;align-items:center;justify-content:center;background:var(--sb-accent);font-size:12px;font-weight:600}
.two{display:flex;flex-direction:column;min-width:0;flex:1;line-height:1.25}.two .a{font-weight:500;overflow:hidden;text-overflow:ellipsis}.two .b{font-size:12px;color:var(--mfg);overflow:hidden;text-overflow:ellipsis}
.menu{position:absolute;z-index:20;background:var(--pop);border:1px solid var(--border);border-radius:8px;box-shadow:var(--shadow);padding:4px;min-width:200px}
.mi{all:unset;box-sizing:border-box;display:flex;align-items:center;gap:8px;width:100%;height:32px;padding:0 8px;border-radius:4px;cursor:pointer;font-size:14px}
.mi:hover{background:var(--accent)}.ml{padding:6px 8px;font-size:12px;color:var(--mfg)}.msep{height:1px;background:var(--border);margin:4px -4px}
.kbd{margin-left:auto;font-size:12px;color:var(--mfg);letter-spacing:.04em}
/* main */
.main{flex:1;min-width:0;display:flex;flex-direction:column;position:relative;background:var(--bg);margin:8px 8px 8px 0;border-radius:12px;box-shadow:0 0 0 1px var(--border),0 1px 3px rgba(8,6,6,.04);overflow:hidden}
.app.mobile .main{margin:0;border-radius:0;box-shadow:none}
.top{height:52px;flex:none;display:flex;align-items:center;gap:8px;padding:0 14px}
.ib{all:unset;display:inline-flex;align-items:center;justify-content:center;width:28px;height:28px;border-radius:6px;cursor:pointer;color:var(--mfg)}
.ib:hover{background:var(--accent);color:var(--fg)}
.vsep{width:1px;height:16px;background:var(--border)}
.crumb{display:flex;align-items:center;gap:6px;font-size:14px;color:var(--mfg)}.crumb b{color:var(--fg);font-weight:400}
.btn{all:unset;box-sizing:border-box;display:inline-flex;align-items:center;justify-content:center;gap:6px;height:32px;padding:0 12px;border-radius:8px;font-size:14px;font-weight:500;cursor:pointer;white-space:nowrap}
.btn.primary{background:var(--primary);color:var(--pfg)}.btn.outline{border:1px solid var(--input);background:var(--bg)}.btn.ghost{color:var(--mfg)}
.btn.danger{background:var(--deep);color:#fff}.btn.lg{height:40px;padding:0 16px}.btn.full{width:100%}
.view{flex:1;min-height:0;display:flex;flex-direction:column;align-items:center;overflow:hidden}
.thread{width:100%;max-width:880px;padding:24px 24px 40px;display:flex;flex-direction:column;gap:32px}
.um{align-self:flex-end;max-width:80%;display:flex;flex-direction:column;align-items:flex-end;gap:4px}
.ubub{background:var(--bubble);border-radius:20px;padding:12px 18px;line-height:1.6;font-size:16px}
.am{display:flex;flex-direction:column;gap:12px;font-size:16px;line-height:1.75}
.am p{max-width:none}
.mark{width:22px;height:22px;display:inline-block}
.mark.live{animation:seal 1.4s ease-in-out infinite}
@keyframes seal{0%,100%{transform:scale(1);opacity:1}50%{transform:scale(.82);opacity:.55}}
/* Thinking indicators (no logo): A = column of three pillars from the L construction; B = highlighter sweep; C = pen arc */
.ld{display:inline-flex;align-items:center;justify-content:center;width:18px;height:18px;flex:none}
.ld-col{position:relative;display:inline-flex;gap:2.5px;align-items:stretch;height:11px;padding:0 1.5px}
.ld-col:before,.ld-col:after{content:"";position:absolute;left:-1px;right:-1px;height:1.5px;background:var(--redtext);border-radius:1px}
.ld-col:before{top:-3px}.ld-col:after{bottom:-3px}

/* ===== Lexon morphing loader: shapes dissolve into dots that travel and re-form the next shape ===== */
.lq{display:inline-flex;width:20px;height:20px;flex:none;color:var(--redtext)}
.lq.xl{width:120px;height:120px}
.lq svg{width:100%;height:100%;overflow:visible}
/* ===== Lexon loader family (owner request): hand-drawn feel, one per turn ===== */
.lx{--c:var(--redtext);display:inline-flex;align-items:center;justify-content:center;width:20px;height:20px;flex:none;position:relative;color:var(--c)}
.lx.xl{width:72px;height:72px}
.lx svg{width:100%;height:100%;overflow:visible}
/* 1 Pen: a signature stroke writes itself, nib follows */
.lx-pen .ink{stroke-dasharray:46;stroke-dashoffset:46;animation:write 1.8s cubic-bezier(.5,0,.3,1) infinite}
@keyframes write{0%{stroke-dashoffset:46;opacity:1}60%{stroke-dashoffset:0;opacity:1}85%{stroke-dashoffset:0;opacity:0}100%{stroke-dashoffset:46;opacity:0}}
.lx-pen .base{opacity:.35}
/* 2 Paper: pages turn over a document */
.lx-page .flip{transform-origin:5px 10px;animation:turn 1.6s cubic-bezier(.6,0,.3,1) infinite}
@keyframes turn{0%{transform:scaleX(1)}45%{transform:scaleX(-1)}55%{transform:scaleX(-1);opacity:1}70%{opacity:0}100%{transform:scaleX(-1);opacity:0}}
.lx-page .ln{stroke-dasharray:8;stroke-dashoffset:8;animation:lines 1.6s ease-out infinite}
.lx-page .ln:nth-of-type(2){animation-delay:.12s}.lx-page .ln:nth-of-type(3){animation-delay:.24s}
@keyframes lines{0%,20%{stroke-dashoffset:8}55%,100%{stroke-dashoffset:0}}
/* 3 Seal: a stamp presses, the ring inks in, then releases (brand "cap") */
.lx-seal .stamp{transform-origin:10px 10px;animation:press 1.7s cubic-bezier(.5,0,.2,1) infinite}
@keyframes press{0%{transform:translateY(-4px) scale(1.15);opacity:0}30%{transform:translateY(0) scale(1);opacity:1}70%{opacity:1}100%{opacity:0}}
.lx-seal .ring{stroke-dasharray:44;stroke-dashoffset:44;animation:ring 1.7s ease-out infinite}
@keyframes ring{0%,28%{stroke-dashoffset:44}60%,100%{stroke-dashoffset:0}}
/* 4 Section: legal glyphs morph (§ ¶ ⁂ †) like a hand flipping marks */
.lx-glyph span{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-family:var(--serif);font-size:19px;line-height:1;opacity:0;animation:glyph 3.2s infinite}
.lx.xl.lx-glyph span{font-size:66px}
.lx-glyph span:nth-child(2){animation-delay:.8s}.lx-glyph span:nth-child(3){animation-delay:1.6s}.lx-glyph span:nth-child(4){animation-delay:2.4s}
@keyframes glyph{0%{opacity:0;transform:rotate(-25deg) scale(.6)}6%{opacity:1;transform:rotate(0) scale(1)}20%{opacity:1;transform:rotate(4deg) scale(1)}26%,100%{opacity:0;transform:rotate(25deg) scale(.6)}}
/* 5 Column: the L's three pillars catch the light (existing A) */
.lx-col .p{animation:pil 1.2s ease-in-out infinite}.lx-col .p2{animation-delay:.18s}.lx-col .p3{animation-delay:.36s}
/* 6 Highlight: a stabilo pass over lines of text */
.lx-mark .hl{transform-origin:left;animation:hl 1.6s cubic-bezier(.6,0,.3,1) infinite}
@keyframes hl{0%{transform:scaleX(0);opacity:.9}55%{transform:scaleX(1);opacity:.9}80%,100%{transform:scaleX(1);opacity:0}}

  case 'loaders': b=`<div style="display:flex;flex-direction:column;gap:6px"><h2 style="margin:0;font-family:var(--serif);font-weight:400;font-size:28px">Thinking indicator</h2><p style="margin:0;color:var(--mfg)">One continuous motion: each mark is drawn, breaks into dots, the dots travel, and they re-form the next mark. Each round starts with the Lexon mark, then every other mark once in a shuffled order (${LQ_SCENES.slice(1).map(x=>x.n).join(', ')}). Between marks the dots wander for 10–14 s. When the answer finishes, the motion gathers into the Lexon mark.</p></div><div style="display:grid;grid-template-columns:1.4fr 1fr;gap:16px"><div class="tcard2" style="align-items:center;justify-content:center;height:280px;background:var(--muted);border:0">${lq(true)}</div><div class="tcard2" style="justify-content:center;gap:18px;padding:24px"><div style="font-size:13px;color:var(--mfg)">Actual size in a chat</div><div class="who">${lq()}<span class="shim">Thinking…</span></div><div class="who" style="font-size:15px">${lq()}<span class="shim">Reading the question…</span></div><div style="display:flex;gap:8px;margin-top:6px"><button class="btn outline" onclick="document.querySelectorAll('.lq').forEach(e=>e.__lqFinish&&e.__lqFinish())">Simulate answer finished</button><button class="btn ghost" onclick="render()">Restart</button></div></div></div>`; break;
  case 'streaming': b=um(Q1)+`<div class="am">${who('Thought for 8 seconds',false,true)}<p>Pasal 1320 KUHPerdata menetapkan empat syarat sahnya perjanjian:</p><ol><li><b>Kesepakatan</b> para pihak yang mengikatkan dirinya.</li><li><b>Kecakapan</b> untuk membuat suatu<span class="caret"></span></li></ol></div>`; c=composer({streaming:true}); break;
  case 'reasoning': b=um(Q1)+`<div class="am">${who('Thought for 14 seconds',true)}${SUMMARY}${A1}${abar()}</div>`; break;
  case 'feedback': b=um(Q1)+`<div class="am">${who('Thought for 14 seconds',false)}${A1}${abar({fb:'up',copied:true})}</div>`; toast=`<div class="toast" role="status">${sv('check')}<span>Thanks for your feedback.</span></div>`; break;
  case 'edit': b=`<div class="edit"><textarea aria-label="Edit message">Apa saja syarat sahnya perjanjian menurut KUHPerdata? Jawab singkat.</textarea><div style="display:flex;justify-content:flex-end;gap:8px"><button class="btn outline">Cancel</button><button class="btn primary">Send</button></div></div><div class="am" style="opacity:.5">${who('Thought for 14 seconds',false)}${A1}</div>`; break;
  case 'branch': b=um('Apa saja syarat sahnya perjanjian menurut KUHPerdata? Jawab singkat.',{branch:true,show:true})+`<div class="am">${who('Thought for 6 seconds',false)}${A1b}${abar()}</div>`; break;
  case 'stopped': b=um(Q1)+`<div class="am">${who('Thought for 9 seconds',false)}<p>Pasal 1320 KUHPerdata menetapkan empat syarat sahnya perjanjian:</p><ol><li><b>Kesepakatan</b> para pihak yang mengikatkan dirinya.</li><li><b>Kecakapan</b> untuk membuat suatu</li></ol><div class="note">${sv('square',14)}Stopped</div>${abar()}</div>`; break;
  case 'error': b=um(Q1)+`<div class="am">${who('',null)}<p>Pasal 1320 KUHPerdata menetapkan empat syarat sahnya perjanjian:</p><div class="alert" role="alert">${sv('alert',18,'style="color:var(--redtext);flex:none;margin-top:1px"')}<div style="flex:1"><div class="ttl">The answer could not be completed</div><div style="color:var(--mfg);margin-top:2px">The AI service is temporarily unavailable. Your message is saved; try again in a moment.</div></div><button class="btn outline" style="flex:none">${sv('regen',14)}Try again</button></div></div>`; break;
  case 'reconnect': b=um(Q1)+`<div class="am">${who('Thought for 8 seconds',false,true)}<p>Pasal 1320 KUHPerdata menetapkan empat syarat sahnya perjanjian:</p><div class="note" role="status">${sv('wifi',14)}Connection lost. Reconnecting…</div></div>`; c=composer({streaming:true}); break;
  case 'loading': b=`<div style="align-self:flex-end;width:55%"><div class="skel" style="height:44px;border-radius:16px"></div></div><div style="display:flex;flex-direction:column;gap:10px"><div class="skel" style="width:30%"></div><div class="skel" style="width:90%"></div><div class="skel" style="width:75%"></div><div class="skel" style="width:82%"></div></div>`; break;
  default: b=um(Q1)+`<div class="am">${who('Thought for 14 seconds',false)}${A1}${abar()}</div>`;
 }
 return `<div class="main">${topbar(crumbT)}<div class="view"><div style="flex:1;width:100%;display:flex;justify-content:center;overflow:hidden"><div class="thread">${b}</div></div>${['streaming','reconnect'].includes(S)?`<div class="scrolldown" aria-label="Scroll to latest">${sv('down2',18)}</div>`:''}${c}</div>${toast}</div>`;
}
function home(S){const deep=S==='deep';const text=deep?'Bandingkan risiko PKWT dan PKWTT untuk karyawan proyek konstruksi 18 bulan, termasuk kompensasi saat kontrak berakhir.':'';
 return `<div class="main home">${topbar('<b>New chat</b>')}<div class="view" style="justify-content:center;gap:22px;padding-bottom:80px"><div style="display:flex;flex-direction:column;align-items:center;gap:10px;text-align:center"><h1 style="margin:0;font-family:var(--serif);font-weight:400;font-size:46px;letter-spacing:-.01em">Good morning, Ayu</h1></div>${composer({deep,text})}<div class="chips" style="margin-top:14px"><button class="chip">Explain an article</button><button class="chip">Compare two rules</button><button class="chip">Check a clause</button><button class="chip">Summarize a regulation</button></div></div></div>`;}
function history(S){const q=S==='search'?'wanprestasi':S==='noresults'?'hak tanggungan':'';let l='';
 if(S==='empty') l=`<div class="empty"><div class="ic">${sv('chats',20)}</div><h2>No chats yet</h2><p style="margin:0">Start a new chat to ask Lexon about a contract, a regulation, or a case.</p><button class="btn primary" style="margin-top:8px">${sv('plus')}New chat</button></div>`;
 else if(S==='noresults') l=`<div class="empty"><div class="ic">${sv('search',20)}</div><h2>No chats match “hak tanggungan”</h2><p style="margin:0">Search looks in chat titles and messages. Try other words.</p><button class="btn outline" style="margin-top:8px">Clear search</button></div>`;
 else if(S==='search') l=`<p style="margin:0;font-size:13px;color:var(--mfg)">3 chats</p><div class="hrow hl"><div class="ht"><span><mark>Wanprestasi</mark> remedies and damages</span><span class="hd">Nov 4</span></div><div class="hs">…debitur yang melakukan <mark>wanprestasi</mark> dapat dituntut pemenuhan perikatan, ganti rugi, atau pembatalan perjanjian berdasarkan Pasal 1267…</div></div><div class="hrow"><div class="ht"><span>Force majeure clause, supply agreement</span><span class="hd">Nov 5</span></div><div class="hs">…keadaan memaksa membebaskan debitur dari tanggung jawab atas <mark>wanprestasi</mark> jika peristiwa tidak dapat diduga…</div></div><div class="hrow"><div class="ht"><span>Syarat sah perjanjian (Pasal 1320)</span><span class="hd">Today</span></div><div class="hs">…berbeda dengan <mark>wanprestasi</mark>, cacat pada syarat subjektif membuat perjanjian dapat dibatalkan…</div></div>`;
 else {const g=['Today','Today','Yesterday','Previous 7 days','Previous 7 days','Previous 7 days'];let cur='';chats.forEach((t,i)=>{if(g[i]!==cur){cur=g[i];l+=`<div class="glabel" style="padding:10px 12px 0">${cur}</div>`;}l+=`<div class="hrow"><div class="ht"><span>${t}</span><span class="hd">${i<2?'10:42':i<3?'Yesterday':'Nov 4'}</span></div></div>`;});}
 return `<div class="main">${topbar('<span>Assistant</span>'+sv('right',14)+'<b>Chats</b>')}<div class="view"><div class="hist"><div style="display:flex;justify-content:space-between;align-items:flex-end"><h1 class="ptitle">Chats</h1><button class="btn primary">${sv('plus')}New chat</button></div><div style="position:relative"><span style="position:absolute;left:12px;top:10px;color:var(--mfg)">${sv('search')}</span><input class="inp ${q?'focus':''}" style="padding-left:36px" aria-label="Search chats" placeholder="Search chats" value="${q}"></div>${l}</div></div></div>`;}
function signin(S){const bad=S==='signin-errors';
 return `<div class="auth"><div class="side"><img src="${document.documentElement.dataset.theme==='dark'||(!document.documentElement.dataset.theme&&matchMedia('(prefers-color-scheme: dark)').matches)?WM_WHITE:WM_INK}" alt="Lexon" style="width:128px"><div class="formwrap"><form onsubmit="return false"><div style="display:flex;flex-direction:column;gap:8px"><h1 style="margin:0;font-family:var(--serif);font-weight:400;font-size:36px">Sign in to Lexon</h1><p style="margin:0;color:var(--mfg)">Enter your work email and password.</p></div>
 <div class="field"><label for="em">Email</label><input id="em" class="inp ${bad?'bad':''}" value="${bad?'ayu@':''}" placeholder="you@firm.co.id">${bad?'<span class="ferr">Enter a valid email address.</span>':''}</div>
 <div class="field"><label for="pw" style="${bad?'color:var(--redtext)':''}">Password <a href="#">Forgot password?</a></label><div style="position:relative"><input id="pw" type="password" class="inp ${bad?'bad':''}" placeholder="••••••••"><button class="ib" style="position:absolute;right:4px;top:4px" aria-label="Show password">${sv('eye')}</button></div>${bad?'<span class="ferr">Enter your password.</span>':''}</div>
 <button class="btn primary lg full">Sign in</button><p style="margin:0;text-align:center;color:var(--mfg);font-size:14px">New to Lexon? <a href="#" style="color:var(--fg);text-underline-offset:4px">Create an account</a></p></form></div></div>
 <div class="cover"><div class="rule">The AI workspace for Indonesian legal practitioners</div><div class="quote">Every answer names the article it rests on, so you can check it yourself.</div><div style="display:flex;justify-content:space-between;align-items:flex-end"><img src="${WM_WHITE}" alt="" style="width:120px;opacity:.9"><small>lexon-ai.com</small></div></div></div>`;}
function settings(S){const app=S==='appearance';
 const nav=[['Account'],['Profile',!app],['Appearance',app],['Security'],['Hukum Nusantara'],['Members'],['Invitations'],['General']].map(([t,on])=>on===undefined?`<div class="glabel" style="padding:12px 8px 4px">${t}</div>`:`<button class="nb ${on?'on':''}">${t}</button>`).join('');
 const prof=`<h3 style="margin:0 0 8px;font-family:var(--serif);font-weight:400;font-size:26px">Profile</h3><div class="srow"><div><div class="rt">Display name</div><div class="rd">How people in your organizations see you.</div></div><input class="inp" style="width:280px" value="Ayu Wardani" aria-label="Display name"></div><div class="srow"><div><div class="rt">Job title</div><div class="rd">Shown under your name in the sidebar.</div></div><input class="inp" style="width:280px" value="Senior Associate" aria-label="Job title"></div><div class="srow"><div><div class="rt">Email</div><div class="rd">Used to sign in. Change it in Security.</div></div><span style="color:var(--mfg)">ayu@hukum-nusantara.co.id</span></div><div style="display:flex;justify-content:flex-end;margin-top:16px"><button class="btn primary">Save</button></div>`;
 const t=[['Light','#F5F4F4','#FFFFFF','#DDDADA',false],['Dark','#181516','#121011','#3A3536',false],['System','linear-gradient(90deg,#F5F4F4 50%,#181516 50%)','linear-gradient(90deg,#FFFFFF 50%,#121011 50%)','#9A9495',true]];
 const appr=`<h3 style="margin:0 0 4px;font-family:var(--serif);font-weight:400;font-size:26px">Appearance</h3><p style="margin:0 0 20px;color:var(--mfg);font-size:13px">Choose how Lexon looks on this device.</p><div role="radiogroup" aria-label="Theme" style="display:flex;gap:16px">${t.map(([n,l,r,line,on])=>`<button class="tcard ${on?'on':''}" role="radio" aria-checked="${on}"><span class="prev"><span style="flex:1;background:${l}"></span><span style="flex:2;background:${r};padding:12px;display:flex;flex-direction:column;gap:6px"><span style="height:8px;width:60%;border-radius:4px;background:${line}"></span><span style="height:8px;width:80%;border-radius:4px;background:${line}"></span></span></span><span style="font-weight:500">${n}</span></button>`).join('')}</div>`;
 return `<div class="overlay"></div><div class="sdlg" role="dialog" aria-modal="true" aria-label="Settings"><div style="height:56px;display:flex;align-items:center;justify-content:space-between;padding:0 16px 0 24px;border-bottom:1px solid var(--border)"><h2 style="margin:0;font-size:16px;font-weight:600">Settings</h2><button class="ib" aria-label="Close settings">${sv('x')}</button></div><div style="flex:1;display:flex;min-height:0"><nav style="width:240px;flex:none;padding:12px;border-right:1px solid var(--sb-border);background:var(--sidebar);display:flex;flex-direction:column;gap:2px">${nav}</nav><div style="flex:1;padding:28px 32px;overflow:auto">${app?appr:prof}</div></div></div>`;}
function mobile(){return `<div class="main"><header class="top" style="height:56px"><button class="ib" aria-label="Open sidebar">${sv('panel')}</button><div class="vsep"></div><span style="font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">Syarat sah perjanjian</span></header><div class="view"><div style="flex:1;width:100%;overflow:hidden"><div class="thread" style="padding:20px 16px 0;gap:22px">${um('Apa saja syarat sahnya perjanjian menurut KUHPerdata?')}<div class="am" style="font-size:15px">${who('Thought for 14 seconds',false)}${A1}</div></div></div>${composer({mobile:true})}</div></div>`;}
function render(){
 const S=(qs.get('s')||location.hash.slice(1)||'newchat'); const st=STATES.includes(S)?S:'newchat';
 const c={home:['newchat','deep','personal'].includes(st),page:['history','search','noresults','empty'].includes(st),active:'a',menu:st==='menu'?'b':null,rename:st==='rename'?'b':null,none:st==='empty'};
 let inner;
 if(st==='signin'||st==='signin-errors') inner=`<div class="app">${signin(st)}</div>`;
 else if(st==='mobile') inner=`<div class="app mobile">${mobile()}</div>`;
 else { let m=c.home?home(st==='personal'?'newchat':st):c.page?history(st):(['settings','appearance','org','user','collapsed'].includes(st)?thread('thread'):thread(st));
   inner=`<div class="app">${sidebar(st,c)}${m}${st==='delete'?`<div class="overlay"></div><div class="dialog" role="alertdialog" aria-modal="true" aria-labelledby="dt"><h2 id="dt">Delete this chat?</h2><p>“Due diligence checklist for PT acquisition” and all its messages will be permanently deleted. This cannot be undone.</p><div style="display:flex;justify-content:flex-end;gap:8px;margin-top:16px"><button class="btn outline">Cancel</button><button class="btn danger">Delete chat</button></div></div>`:''}${['settings','appearance'].includes(st)?settings(st):''}</div>`; }
 const picker=isShot?'':`<nav class="picker" aria-label="Prototype states"><b>State</b>${STATES.map(k=>`<a class="${k===st?'cur':''}" href="#${k}">${k}</a>`).join('')}<span style="margin-left:auto;display:flex;gap:6px"><a href="javascript:void 0" onclick="document.documentElement.dataset.theme='light';render()">Light</a><a href="javascript:void 0" onclick="document.documentElement.dataset.theme='dark';render()">Dark</a></span></nav>`;
 document.getElementById('root').innerHTML=picker+`<div class="stage" id="stage">${inner}</div>`;fit();
}
function fit(){const st=document.getElementById('stage');if(!st)return;const app=st.firstElementChild;const W=app.classList.contains('mobile')?390:1440,H=app.classList.contains('mobile')?844:900;if(isShot){st.style.height=H+'px';return;}const z=Math.min(1,st.clientWidth/W);app.style.transform=`scale(${z})`;st.style.height=(H*z)+'px';if(W===390){st.style.width='';}}
addEventListener('hashchange',render);addEventListener('resize',fit);render();
</script>
