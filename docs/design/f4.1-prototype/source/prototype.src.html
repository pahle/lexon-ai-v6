/* Layout: 1440x900 app canvas scaled to fit; tokens = brand kit v4.1 light + Claude-derived dark (owner review). */
:root{
  --bg:#FFFFFF;--fg:#1A1718;--card:#FFFFFF;--pop:#FFFFFF;--muted:#F5F4F4;--mfg:#6B6567;--accent:#F2F1F1;
  --border:#ECEAEA;--input:#DDDADA;--primary:#B3202A;--pfg:#FFFFFF;--ring:#B3202A;--deep:#8E1A22;
  --sidebar:#F5F4F4;--sb-accent:#ECEAEA;--sb-border:#E6E4E4;--sb-primary:#1A1718;--sb-pfg:#FFFFFF;
  --tint:#F7E6E8;--flag:#FBF1F2;--deleted:#9A9495;--redtext:#B3202A;--bubble:#F5F4F4;--overlay:rgba(8,6,6,.45);
  --shadow:0 0 0 1px rgba(26,23,24,.08),0 16px 40px -12px rgba(8,6,6,.22);--mark:#F7E6E8;
  --sans:"Lexon Inter",system-ui,-apple-system,"Segoe UI",sans-serif;--serif:"Lexon Garamond",Georgia,serif;--doc:"Lexon Bonum","Bookman Old Style",Georgia,serif;
  --chrome:#EFEEEE;--chrome-fg:#1A1718;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){

  --border:#2C2829;--input:#57504F;--primary:#B3202A;--pfg:#FFFFFF;--ring:#F0646C;--deep:#8E1A22;
  --sidebar:#181516;--sb-accent:#2A2627;--sb-border:#2C2829;--sb-primary:#F2F0F0;--sb-pfg:#121011;
  --tint:#3A1A1E;--flag:#2A1517;--deleted:#7D7678;--redtext:#F0646C;--bubble:#242021;--overlay:rgba(0,0,0,.6);
  --shadow:0 0 0 1px #2C2829,0 16px 40px -12px #000;--mark:#4A1E23;--chrome:#080606;--chrome-fg:#F2F0F0;color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#121011;--fg:#F2F0F0;--card:#1A1718;--pop:#1A1718;--muted:#242021;--mfg:#A69FA1;--accent:#242021;
  --border:#2C2829;--input:#57504F;--primary:#B3202A;--pfg:#FFFFFF;--ring:#F0646C;--deep:#8E1A22;
  --sidebar:#181516;--sb-accent:#2A2627;--sb-border:#2C2829;--sb-primary:#F2F0F0;--sb-pfg:#121011;
  --tint:#3A1A1E;--flag:#2A1517;--deleted:#7D7678;--redtext:#F0646C;--bubble:#242021;--overlay:rgba(0,0,0,.6);
  --shadow:0 0 0 1px #2C2829,0 16px 40px -12px #000;--mark:#4A1E23;--chrome:#080606;--chrome-fg:#F2F0F0;color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--chrome);color:var(--fg);font-family:var(--sans);font-size:14px;padding-block:12px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
body.shot{padding:0;background:var(--bg)}
button,input,textarea{font:inherit;color:inherit}
.picker{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-bottom:12px;color:var(--chrome-fg)}
.picker b{margin-right:4px;font-weight:600}
.picker a{color:var(--chrome-fg);text-decoration:none;padding:3px 9px;border:1px solid var(--input);border-radius:6px;font-size:12px;background:var(--bg)}
.picker a.cur{background:var(--primary);border-color:var(--primary);color:#fff}
.picker a:focus-visible{outline:2px solid var(--ring);outline-offset:2px}
.stage{overflow:hidden;border-radius:10px;box-shadow:0 0 0 1px var(--input)}
body.shot .stage{border-radius:0;box-shadow:none}
.app{width:1440px;height:900px;display:flex;position:relative;overflow:hidden;background:var(--sidebar);transform-origin:0 0}
.app.mobile,.app.plain{background:var(--bg)}
.app.mobile{width:390px;height:844px}
/* sidebar-07 */
.sb{width:256px;flex:none;background:var(--sidebar);display:flex;flex-direction:column;padding:8px;gap:4px;position:relative}
.sb.icon{width:49px}
.nb{all:unset;box-sizing:border-box;display:flex;align-items:center;gap:8px;width:100%;height:32px;padding:0 8px;border-radius:6px;cursor:pointer;font-size:14px;white-space:nowrap;overflow:hidden;position:relative;color:var(--fg)}
.nb:hover{background:var(--sb-accent)}.nb.on{background:var(--sb-accent);font-weight:500}
.nb .t{flex:1;overflow:hidden;text-overflow:ellipsis}.nb svg{flex:none}
.nb .more{display:none;width:24px;height:24px;border-radius:4px;align-items:center;justify-content:center;color:var(--mfg)}
.nb.on .more,.nb.menuopen .more{display:flex}
.big{height:48px}
.sub{margin-left:15px;padding-left:10px;border-left:1px solid var(--sb-border);display:flex;flex-direction:column;gap:1px}
.sub .nb{height:28px}
.glabel{padding:14px 8px 6px;font-size:12px;color:var(--mfg);font-weight:500}
.ini{width:32px;height:32px;border-radius:8px;flex:none;display:flex;align-items:center;justify-content:center;background:var(--sb-primary);color:var(--sb-pfg);font-size:12px;font-weight:600;letter-spacing:.02em}
.avatar{width:32px;height:32px;border-radius:8px;flex:none;display:flex;align-items:center;justify-content:center;background:var(--sb-accent);font-size:12px;font-weight:600}
.two{display:flex;flex-direction:column;min-width:0;flex:1;line-height:1.25}.two .a{font-weight:500;overflow:hidden;text-overflow:ellipsis}.two .b{font-size:12px;color:var(--mfg);overflow:hidden;text-overflow:ellipsis}
.menu{position:absolute;z-index:20;background:var(--pop);border:1px solid var(--border);border-radius:8px;box-shadow:var(--shadow);padding:4px;min-width:200px}
.mi{all:unset;box-sizing:border-box;display:flex;align-items:center;gap:8px;width:100%;height:32px;padding:0 8px;border-radius:4px;cursor:pointer;font-size:14px}
.mi:hover{background:var(--accent)}.ml{padding:6px 8px;font-size:12px;color:var(--mfg)}.msep{height:1px;background:var(--border);margin:4px -4px}
.kbd{margin-left:auto;font-size:12px;color:var(--mfg);letter-spacing:.04em}
/* main */
.main{flex:1;min-width:0;display:flex;flex-direction:column;position:relative;background:var(--bg);margin:8px 8px 8px 0;border-radius:12px;box-shadow:0 0 0 1px var(--border),0 1px 3px rgba(8,6,6,.04);overflow:hidden}
.app.mobile .main{margin:0;border-radius:0;box-shadow:none}
.top{height:52px;flex:none;display:flex;align-items:center;gap:8px;padding:0 14px}
.ib{all:unset;display:inline-flex;align-items:center;justify-content:center;width:28px;height:28px;border-radius:6px;cursor:pointer;color:var(--mfg)}
.ib:hover{background:var(--accent);color:var(--fg)}
.vsep{width:1px;height:16px;background:var(--border)}
.crumb{display:flex;align-items:center;gap:6px;font-size:14px;color:var(--mfg)}.crumb b{color:var(--fg);font-weight:400}
.btn{all:unset;box-sizing:border-box;display:inline-flex;align-items:center;justify-content:center;gap:6px;height:32px;padding:0 12px;border-radius:8px;font-size:14px;font-weight:500;cursor:pointer;white-space:nowrap}
.btn.primary{background:var(--primary);color:var(--pfg)}.btn.outline{border:1px solid var(--input);background:var(--bg)}.btn.ghost{color:var(--mfg)}
.btn.danger{background:var(--deep);color:#fff}.btn.lg{height:40px;padding:0 16px}.btn.full{width:100%}
.view{flex:1;min-height:0;display:flex;flex-direction:column;align-items:center;overflow:hidden}
.thread{width:100%;max-width:880px;padding:24px 24px 40px;display:flex;flex-direction:column;gap:32px}
.um{align-self:flex-end;max-width:80%;display:flex;flex-direction:column;align-items:flex-end;gap:4px}
.ubub{background:var(--bubble);border-radius:20px;padding:12px 18px;line-height:1.6;font-size:16px}
.am{display:flex;flex-direction:column;gap:12px;font-size:16px;line-height:1.75}
.am p{max-width:none}
.mark{width:22px;height:22px;display:inline-block}
.mark.live{animation:seal 1.4s ease-in-out infinite}
@keyframes seal{0%,100%{transform:scale(1);opacity:1}50%{transform:scale(.82);opacity:.55}}
/* Thinking indicators (no logo): A = column of three pillars from the L construction; B = highlighter sweep; C = pen arc */
.ld{display:inline-flex;align-items:center;justify-content:center;width:18px;height:18px;flex:none}
.ld-col{position:relative;display:inline-flex;gap:2.5px;align-items:stretch;height:11px;padding:0 1.5px}
.ld-col:before,.ld-col:after{content:"";position:absolute;left:-1px;right:-1px;height:1.5px;background:var(--redtext);border-radius:1px}
.ld-col:before{top:-3px}.ld-col:after{bottom:-3px}
.ld-col i{display:block;width:1.75px;background:var(--redtext);border-radius:1px;animation:pil 1.2s ease-in-out infinite}
.ld-col i:nth-child(2){animation-delay:.18s}.ld-col i:nth-child(3){animation-delay:.36s}
@keyframes pil{0%,100%{opacity:.18}40%{opacity:1}}
.ld-sweep{position:relative;color:var(--mfg);overflow:hidden;padding:0 2px}
.ld-sweep:before{content:"";position:absolute;left:0;top:50%;height:.55em;width:45%;background:color-mix(in srgb,var(--primary) 26%,transparent);border-radius:3px;z-index:-1;animation:sweep 1.5s cubic-bezier(.6,0,.4,1) infinite}
@keyframes sweep{0%{transform:translateX(-110%)}100%{transform:translateX(240%)}}
.ld-arc{animation:spin 1s linear infinite}
.ld-arc circle{animation:dash 1.5s ease-in-out infinite}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes dash{0%{stroke-dasharray:1 40;stroke-dashoffset:0}50%{stroke-dasharray:22 40;stroke-dashoffset:-6}100%{stroke-dasharray:22 40;stroke-dashoffset:-32}}


/* ===== Lexon morphing loader: shapes dissolve into dots that travel and re-form the next shape ===== */
.lq{display:inline-flex;width:20px;height:20px;flex:none;color:var(--redtext)}
.lq.xl{width:120px;height:120px}
.lq svg{width:100%;height:100%;overflow:visible}
/* ===== Lexon loader family (owner request): hand-drawn feel, one per turn ===== */
.lx{--c:var(--redtext);display:inline-flex;align-items:center;justify-content:center;width:20px;height:20px;flex:none;position:relative;color:var(--c)}
.lx.xl{width:72px;height:72px}
.lx svg{width:100%;height:100%;overflow:visible}
/* 1 Pen: a signature stroke writes itself, nib follows */
.lx-pen .ink{stroke-dasharray:46;stroke-dashoffset:46;animation:write 1.8s cubic-bezier(.5,0,.3,1) infinite}
@keyframes write{0%{stroke-dashoffset:46;opacity:1}60%{stroke-dashoffset:0;opacity:1}85%{stroke-dashoffset:0;opacity:0}100%{stroke-dashoffset:46;opacity:0}}
.lx-pen .base{opacity:.35}
/* 2 Paper: pages turn over a document */
.lx-page .flip{transform-origin:5px 10px;animation:turn 1.6s cubic-bezier(.6,0,.3,1) infinite}
@keyframes turn{0%{transform:scaleX(1)}45%{transform:scaleX(-1)}55%{transform:scaleX(-1);opacity:1}70%{opacity:0}100%{transform:scaleX(-1);opacity:0}}
.lx-page .ln{stroke-dasharray:8;stroke-dashoffset:8;animation:lines 1.6s ease-out infinite}
.lx-page .ln:nth-of-type(2){animation-delay:.12s}.lx-page .ln:nth-of-type(3){animation-delay:.24s}
@keyframes lines{0%,20%{stroke-dashoffset:8}55%,100%{stroke-dashoffset:0}}
/* 3 Seal: a stamp presses, the ring inks in, then releases (brand "cap") */
.lx-seal .stamp{transform-origin:10px 10px;animation:press 1.7s cubic-bezier(.5,0,.2,1) infinite}
@keyframes press{0%{transform:translateY(-4px) scale(1.15);opacity:0}30%{transform:translateY(0) scale(1);opacity:1}70%{opacity:1}100%{opacity:0}}
.lx-seal .ring{stroke-dasharray:44;stroke-dashoffset:44;animation:ring 1.7s ease-out infinite}
@keyframes ring{0%,28%{stroke-dashoffset:44}60%,100%{stroke-dashoffset:0}}
/* 4 Section: legal glyphs morph (§ ¶ ⁂ †) like a hand flipping marks */
.lx-glyph span{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-family:var(--serif);font-size:19px;line-height:1;opacity:0;animation:glyph 3.2s infinite}
.lx.xl.lx-glyph span{font-size:66px}
.lx-glyph span:nth-child(2){animation-delay:.8s}.lx-glyph span:nth-child(3){animation-delay:1.6s}.lx-glyph span:nth-child(4){animation-delay:2.4s}
@keyframes glyph{0%{opacity:0;transform:rotate(-25deg) scale(.6)}6%{opacity:1;transform:rotate(0) scale(1)}20%{opacity:1;transform:rotate(4deg) scale(1)}26%,100%{opacity:0;transform:rotate(25deg) scale(.6)}}
/* 5 Column: the L's three pillars catch the light (existing A) */
.lx-col .p{animation:pil 1.2s ease-in-out infinite}.lx-col .p2{animation-delay:.18s}.lx-col .p3{animation-delay:.36s}
/* 6 Highlight: a stabilo pass over lines of text */
.lx-mark .hl{transform-origin:left;animation:hl 1.6s cubic-bezier(.6,0,.3,1) infinite}
@keyframes hl{0%{transform:scaleX(0);opacity:.9}55%{transform:scaleX(1);opacity:.9}80%,100%{transform:scaleX(1);opacity:0}}
@media (prefers-reduced-motion:reduce){.lx *{animation:none!important;opacity:1!important;stroke-dashoffset:0!important;transform:none!important}.lx-glyph span:not(:first-child){opacity:0!important}}

@media (prefers-reduced-motion:reduce){.mark.live,.ld-col i,.ld-sweep:before,.ld-arc,.ld-arc circle{animation:none}.ld-col i{opacity:.6}.ld-sweep:before{width:100%;transform:none}}
.tcard2{border:1px solid var(--border);border-radius:12px;padding:10px 14px;display:flex;flex-direction:column;gap:8px}
.tcard2 .th{display:flex;align-items:center;justify-content:space-between;color:var(--mfg);font-size:14px}
.scrolldown{position:absolute;left:50%;transform:translateX(-50%);bottom:150px;width:36px;height:36px;border-radius:999px;background:var(--bg);box-shadow:0 0 0 1px var(--border),0 6px 16px -6px rgba(8,6,6,.25);display:flex;align-items:center;justify-content:center;color:var(--mfg);z-index:5}
.chips{display:flex;flex-wrap:nowrap;gap:8px;justify-content:center}

.am p{margin:0 0 8px}.am ol,.am ul{margin:0 0 8px;padding-left:22px}.am li{margin:3px 0}

.comp{border:1px solid var(--border);border-radius:20px;background:var(--bg);padding:16px 14px 12px 16px;display:flex;flex-direction:column;gap:10px;box-shadow:0 10px 30px -14px rgba(8,6,6,.22),0 2px 6px -2px rgba(8,6,6,.06)}

mark{background:var(--mark);color:inherit;border-radius:3px;padding:0 2px}

 const rec=`${dvHeader({back:'Back to list',av:'AW',title:'Record title',badges:C.badge('Active')+C.badge('Unverified','warn'),meta:[['mail','secondary@line.id'],['calendar','Created 2 Sep 2026'],['clock','Updated today']],acts:btn('out','Secondary')+btn('ban','Destructive','outline dtext')+btn('plus','Primary','primary')})}${dvSplit(dvStats([['users','Count','128','Supporting line'],['wallet','Money','Rp 1,25 jt'],['shield','State','On']])+dvCard({head:dvCHead('Related records','A table inside a record page uses the same parts.','',{n:2}),table:dvTable({cols:[{label:'Organization'},{label:'Role',w:'110px'},{label:'',w:'56px',cls:'w-menu'}],rows:[['Hukum Nusantara','hukum-nusantara','HN','Owner'],['Pro Bono Clinic','pro-bono-clinic','PB','Member']].map(([n,s,i,r])=>({cells:[C.id(n,s,{av:i,sq:true}),C.tag(r),C.open(n)],m:{lead:`<span class="dv-av sq">${i}</span>`,title:n,sub:s,badge:C.tag(r),menu:false}}))})}),dvProps('Details',[['Text','Hukum Nusantara'],['Yes / no','Yes'],['Badge',C.badge('Unverified','warn')],['Date','2 Sep 2026'],['ID','3c8e1f6a-2b7d-4a90-8c15-e4d9b0a72f31',true]]))}`;
 return `<div class="dv-page"><div class="dv-ph"><div><h1 class="ptitle">Data views kit</h1><p>LEX-DS-001 §5.7. Every list and record page in Lexon is built from these parts. Reference only, not a capture state.</p></div></div>${dvTabs([['Tab one',248],['Tab two',2]],'Tab one')}${table}${states}<h2 style="margin:12px 0 0;font-size:13px;font-weight:600;color:var(--mfg);text-transform:uppercase;letter-spacing:.06em">Record page</h2>${rec}</div>`;
}

document.addEventListener('click',e=>{const cb=e.target.closest('.dv-table .dv-cb');if(!cb)return;const table=cb.closest('.dv-table');const card=table.closest('.dv-card');const bar=card&&card.nextElementSibling&&card.nextElementSibling.classList.contains('dv-bar')?card.nextElementSibling:null;
 const set=(el,on)=>{el.classList.toggle('on',on);el.setAttribute('aria-checked',on);el.innerHTML=on?sv('check',12):'';};
 const rows=[...table.querySelectorAll('tbody tr')];
 if(cb.closest('thead')){const on=!cb.classList.contains('on');set(cb,on);rows.forEach(r=>{set(r.querySelector('.dv-cb'),on);r.classList.toggle('sel',on);});}
 else {const on=!cb.classList.contains('on');set(cb,on);cb.closest('tr').classList.toggle('sel',on);}
 const n=rows.filter(r=>r.classList.contains('sel')).length;set(table.querySelector('thead .dv-cb'),n===rows.length&&n>0);
 if(bar){bar.hidden=n===0;bar.querySelector('.k').textContent=n;}});
document.addEventListener('click',e=>{const x=e.target.closest('.dv-bar .x');if(!x)return;const bar=x.closest('.dv-bar');const card=bar.previousElementSibling;card.querySelectorAll('.dv-cb.on').forEach(c=>{c.classList.remove('on');c.setAttribute('aria-checked','false');c.innerHTML='';});card.querySelectorAll('tr.sel').forEach(r=>r.classList.remove('sel'));bar.hidden=true;});

const GROUPS=[
 ['Auth',['sign-in','sign-in-field-errors','sign-in-form-alert','sign-in-pending','sign-up','forgot-password','forgot-password-sent','reset-password','reset-password-invalid','verify-email','two-factor','accept-invitation','accept-invitation-declined','accept-invitation-unavailable','admin-setup','admin-setup-activate','admin-setup-unavailable','onboarding','onboarding-invitations','onboarding-team']],
 ['Status',['not-found','organizations-not-found','workspace-error','platform-no-access']],
 ['Shell',['shell-personal','shell-team','organization-switcher-open','user-menu-open','recent-menu','sidebar-collapsed','mobile-sheet-open','recent-load-failed']],
 ['Chat',['chat-new','chat-starter-pill','chat-deep-thinking','chat-thinking','chat-streaming-scroll','chat-reasoning-collapsed','chat-reasoning-open','chat-answer-actions','chat-copied','chat-copy-failed','chat-feedback','chat-edit','chat-branch','chat-stopped','chat-error','chat-reconnecting','chat-composer-running','chat-thread-loading','chat-floating-menu','chat-rename','chat-delete']],
 ['Chats',['chats-history','chats-search','chats-no-results','chats-empty','chats-loading','chats-load-failed']],
 ['Settings',['settings-profile','settings-appearance','settings-security','settings-members','settings-invitations','settings-general','settings-profile-save-failed','settings-members-load-failed','toast-success']],
 ['Platform',['platform-accounts','platform-accounts-search','platform-accounts-filtered','platform-accounts-row-menu','platform-accounts-no-results','platform-accounts-loading','platform-accounts-error','platform-accounts-invitations','platform-account-invite','platform-account-detail','platform-account-unverified','platform-account-disabled','platform-account-disable','platform-account-sign-out','platform-organizations','platform-organizations-empty','platform-organizations-loading','platform-organizations-error','platform-organization-provision','platform-organization-provisioning','platform-organization-active']],
 ['Indicator',['indicator']]
];
const AUTHMAP={'sign-in':'signin','sign-in-field-errors':'signin-errors','sign-up':'signup','forgot-password':'forgot','forgot-password-sent':'forgot-sent','reset-password':'reset','reset-password-invalid':'reset-invalid','verify-email':'verify','two-factor':'twofactor','accept-invitation':'invite','accept-invitation-unavailable':'invite-invalid','admin-setup':'setup','admin-setup-unavailable':'setup-invalid','onboarding':'onboard-1','onboarding-invitations':'onboard-2','onboarding-team':'onboard-3','accept-invitation-declined':'invite-declined','admin-setup-activate':'setup-activate'};
const STATUSMAP={'not-found':'notfound','organizations-not-found':'org-notfound','workspace-error':'ws-error','platform-no-access':'noaccess'};
const THREADMAP={'chat-thinking':'thinking','chat-streaming-scroll':'streaming','chat-reasoning-collapsed':'thread','chat-reasoning-open':'reasoning','chat-answer-actions':'actions','chat-edit':'edit','chat-branch':'branch','chat-stopped':'stopped','chat-error':'error','chat-reconnecting':'reconnect','chat-thread-loading':'loading','chat-floating-menu':'thread','chat-rename':'thread','chat-delete':'thread','organization-switcher-open':'thread','user-menu-open':'thread','recent-menu':'thread','sidebar-collapsed':'thread','mobile-sheet-open':'thread'};
function screen(st){
 UI={fmenu:st==='chat-floating-menu'};
 const app=(sb,main,extra='',sheet=false)=>`<div class="app ${MOB?'mobile':''} ${MOB&&sheet?'sheet':''}">${MOB&&sheet?'<div class="overlay"></div>':''}${sb}${main}${extra}</div>`;
 if(st==='kit') return `<div class="app ${MOB?'mobile':''}">${sidebar('personal',{platform:'acct',none:true})}${pmain(kitPage())}</div>`;
 if(AUTHMAP[st]) return `<div class="app ${MOB?'mobile':''}">${authState(AUTHMAP[st])}</div>`;
 if(st==='sign-in-form-alert'||st==='sign-in-pending') return `<div class="app ${MOB?'mobile':''}">${signinVariant(st==='sign-in-pending'?'pending':'alert')}</div>`;
 if(STATUSMAP[st]) return statusPage(STATUSMAP[st]);
 if(st==='settings-profile-save-failed') return settingsAll('profile',{failed:true});
 if(st==='settings-members-load-failed') return settingsAll('members',{failed:true});
 if(st.startsWith('settings-')) return settingsAll(st.slice(9));
 if(st==='recent-load-failed'){const main=home('newchat');return app(sidebar('x',{home:true,active:null,failed:true}),main,'',true);}
 if(st==='chats-load-failed') return app(sidebar('x',{page:true,failed:true}),history('failed'));
 if(st==='chat-copy-failed') return app(sidebar('x',{active:'a'}),chatShell(um(Q1)+`<div class="am">${who('Thought for 14 seconds',false)}${A1}${abar({failed:true})}</div>`).replace(MOB?'justify-content:center;overflow:hidden">':'@@','justify-content:center;align-items:flex-end;overflow:hidden">'));
 if(st==='chat-composer-running'){let m=thread('streaming');m=m.replace(/(<textarea id="cmp"[^>]*>)(<\/textarea>)/,'$1Bagaimana jika salah satu pihak masih di bawah umur?$2').replace('<div class="disc">Lexon can make mistakes. Verify important legal information.</div>','<div class="disc" role="status" style="color:var(--fg)">Wait for the answer to finish, or stop it.</div>');return app(sidebar('x',{active:'a'}),m);}
 if(st==='toast-success') return settingsAll('profile',{toast:toastEl('Changes saved.')});
 if(st.startsWith('platform-')&&st!=='platform-no-access') return platformScreen(st);
 if(st==='indicator') return app(sidebar('x',{active:'a'}),thread('loaders'));
 if(st.startsWith('chats-')){const k={'chats-history':'history','chats-search':'search','chats-no-results':'noresults','chats-empty':'empty'}[st];
  if(st==='chats-loading') return app(sidebar('x',{page:true,loading:true}),historyLoading());
  return app(sidebar('x',{page:true,active:'a',none:k==='empty'}),history(k));}
 if(['shell-personal','shell-team','chat-new','chat-deep-thinking','chat-starter-pill'].includes(st)){
  const sb=sidebar(st==='shell-personal'?'personal':'x',{home:true,active:null});
  const main=st==='chat-starter-pill'?starterPill():home(st==='chat-deep-thinking'?'deep':'newchat');
  return app(sb,main);}
 const sk={'organization-switcher-open':'org','user-menu-open':'user','sidebar-collapsed':MOB?'x':'collapsed'}[st]||'x';
 const c={active:'a',menu:st==='recent-menu'?'b':null};
 const sheet=['mobile-sheet-open','organization-switcher-open','user-menu-open','recent-menu'].includes(st);
 let main;
 if(st==='chat-copied') main=chatShell(um(Q1)+`<div class="am">${who('Thought for 14 seconds',false)}${A1}${abar({copied:true})}</div>`);
 else if(st==='chat-feedback') main=chatShell(um(Q1)+`<div class="am">${who('Thought for 14 seconds',false)}${A1}${abar({fb:'up'})}</div>`,{toast:toastEl('Thanks for your feedback.')});
 else main=thread(THREADMAP[st]||'thread');
 let extra='';
 if(st==='chat-delete') extra=`<div class="overlay"></div><div class="dialog" role="alertdialog" aria-modal="true" aria-labelledby="dt"><h2 id="dt">Delete this chat?</h2><p>“Syarat sah perjanjian (Pasal 1320)” and all its messages will be permanently deleted. This cannot be undone.</p><div style="display:flex;justify-content:flex-end;gap:8px;margin-top:16px"><button class="btn outline">Cancel</button><button class="btn danger">Delete chat</button></div></div>`;
 if(st==='chat-rename') extra=`<div class="overlay"></div><div class="dialog" role="dialog" aria-modal="true" aria-labelledby="rt"><h2 id="rt">Rename chat</h2><div class="field"><label for="rn">Chat title</label><input id="rn" class="inp focus" value="Syarat sah perjanjian (Pasal 1320)"></div><div style="display:flex;justify-content:flex-end;gap:8px;margin-top:16px"><button class="btn outline">Cancel</button><button class="btn primary">Save</button></div></div>`;
 return app(sidebar(sk,c),main,extra,sheet);
}
const ALLIDS=GROUPS.flatMap(g=>g[1]);
function render(){
 const S=(qs.get('s')||location.hash.slice(1)||'chat-new'); const st=ALLIDS.includes(S)||S==='kit'?S:'chat-new';
 const inner=screen(st);
 const href=(k,m)=>`?${m?'m=1&':''}${document.documentElement.dataset.theme?'theme='+document.documentElement.dataset.theme+'&':''}#${k}`;
 const picker=isShot?'':`<nav class="picker" aria-label="Prototype states">${GROUPS.map(([g,ks])=>`<b style="width:64px">${g}</b>${ks.map(k=>`<a class="${k===st?'cur':''}" href="${href(k,MOB)}">${k}</a>`).join('')}<span style="flex-basis:100%;height:0"></span>`).join('')}<b style="width:64px">Kit</b><a class="${st==='kit'?'cur':''}" href="${href('kit',MOB)}">kit (data views reference)</a><span style="flex-basis:100%;height:0"></span><b style="width:64px">View</b><a class="${MOB?'':'cur'}" href="${href(st,false)}">Desktop 1440×900</a><a class="${MOB?'cur':''}" href="${href(st,true)}">Mobile 390×844</a><a href="javascript:void 0" onclick="document.documentElement.dataset.theme='light';render()">Light</a><a href="javascript:void 0" onclick="document.documentElement.dataset.theme='dark';render()">Dark</a><span style="color:var(--chrome-fg);font-size:12px;margin-left:8px">State names match the F4.1 capture ids.</span></nav>`;
 document.getElementById('root').innerHTML=picker+`<div class="stage" id="stage">${inner}</div>`;
 document.querySelectorAll('.scrolldown').forEach(b=>{const cw=b.parentElement.querySelector('.cw');if(cw)cw.prepend(b);});fit();
}

function fit(){const st=document.getElementById('stage');if(!st)return;const app=st.firstElementChild;const W=app.classList.contains('mobile')?390:1440,H=app.classList.contains('mobile')?844:900;if(isShot){st.style.height=H+'px';return;}const z=Math.min(1,st.clientWidth/W);app.style.transform=`scale(${z})`;st.style.height=(H*z)+'px';if(W===390){st.style.width='';}}
addEventListener('hashchange',render);addEventListener('resize',fit);render();
</script>
